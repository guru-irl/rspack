name: PR59 missed-row diagnosis and extra pairs
on:
  push:
    branches: [bench/pr59-xplat-cost-profile]
    paths: ['.github/workflows/bench-pr59-cost-profile.yml', 'bench/cost-profile/**', 'bench/wide-memory/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: pr59-cost-profile-${{ github.sha }}
  cancel-in-progress: false
env:
  COST_SOURCE_SHA: 1810ebe4ca553451b1f4e6237095a0329da87436
jobs:
  profile:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set scratch paths
        run: |
          mkdir -p "$PWD/.bench-wide/tmp" "$PWD/.bench-wide/results"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$PWD/.bench-wide/tmp" "$PWD/.bench-wide/tmp" "$PWD/.bench-wide/tmp" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 79c650c24e4b468e743ebfe6454b3b2bc6650938
          path: source
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          name: wide-binding-macOS-cost
          run-id: 41149287712
          github-token: ${{ github.token }}
          path: .bench-wide/bindings/wide-binding-macOS-cost/
      - uses: actions/download-artifact@v4
        with:
          pattern: wide-binding-macOS-*
          run-id: 41106150672
          github-token: ${{ github.token }}
          path: .bench-wide/bindings/
      - name: Profile filesystem work, delivered events and rebuilds
        env:
          BENCH_DIAGNOSTIC: '1'
        run: |
          set -euo pipefail
          cp bench/cost-profile/profile.cjs bench/wide-memory/diagnostic.cjs
          bash bench/wide-memory/measure.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-profile-summary
          path: .bench-wide/results/profile-summary.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-profile-raw
          path: .bench-wide/results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  extra:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set scratch paths
        run: |
          mkdir -p "$PWD/.bench-wide/tmp" "$PWD/.bench-wide/results"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$PWD/.bench-wide/tmp" "$PWD/.bench-wide/tmp" "$PWD/.bench-wide/tmp" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 79c650c24e4b468e743ebfe6454b3b2bc6650938
          path: source
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          name: wide-results-macOS
          run-id: 41157424635
          github-token: ${{ github.token }}
          path: .bench-wide/original/
      - uses: actions/download-artifact@v4
        with:
          name: wide-binding-macOS-cost
          run-id: 41149287712
          github-token: ${{ github.token }}
          path: .bench-wide/bindings/wide-binding-macOS-cost/
      - uses: actions/download-artifact@v4
        with:
          pattern: wide-binding-macOS-*
          run-id: 41106150672
          github-token: ${{ github.token }}
          path: .bench-wide/bindings/
      - name: Add five uninstrumented symlink pairs per arm
        env:
          BENCH_PROBE_SETS: '10'
        run: |
          set -euo pipefail
          cp bench/cost-profile/extra.cjs bench/wide-memory/measure.cjs
          bash bench/wide-memory/measure.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wide-results-macOS
          path: .bench-wide/results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  summarize:
    needs: extra
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - uses: actions/download-artifact@v4
        with:
          name: wide-results-macOS
          path: .bench-wide/collected/wide-results-macOS/
      - uses: actions/download-artifact@v4
        with:
          name: wide-results-Linux
          run-id: 41157424635
          github-token: ${{ github.token }}
          path: .bench-wide/collected/wide-results-Linux/
      - uses: actions/download-artifact@v4
        with:
          name: wide-results-Windows
          run-id: 41157424635
          github-token: ${{ github.token }}
          path: .bench-wide/collected/wide-results-Windows/
      - run: node bench/wide-memory/cost-report.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cost-measurements
          path: .bench-wide/report/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
