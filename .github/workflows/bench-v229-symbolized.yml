name: Symbolized 2.2.9 GNU Binding
on:
  push:
    branches: ['bench/v2.2.9-symbolized-gnu']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TMPDIR: ${{ github.workspace }}/bench-data/temp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download preserved binary and symbol evidence
        run: |
          mkdir -p bench-data/temp
          gh run download 38963607468 --name v229-symbolized-pack --dir bench-data
          grep -E ' [tT] <rspack_binding_api::(plugins::js_loader::context::JsLoaderContext|module::ModuleObject)' bench-data/results/symbols.txt || true
          grep -E 'JsLoaderContext|ModuleObject' bench-data/results/symbols.txt | grep -E 'to_napi_value|from_napi_value|call_js_cb' | cut -c1-1600 || true
          nm --defined-only bench-data/pack/rspack.linux-x64-gnu.node | head -8 || true
          readelf --version-info bench-data/pack/rspack.linux-x64-gnu.node | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -5
