name: Symbolized 2.2.9 GNU Binding
on:
  push:
    branches: ['bench/v2.2.9-symbolized-gnu']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TMPDIR: ${{ github.workspace }}/bench-data/temp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore completed binary, parity checks and FP recording
        run: |
          mkdir -p bench-data/temp
          gh run download 38970405248 --name v229-symbolized-final --dir bench-data
          cat bench-data/results/binary-verification.json
          cat bench-data/results/overhead.json
          grep -E 'JsLoaderContext|call_js_cb|_RN' bench-data/results/smoke.perf.script | head -6 | cut -c1-1200 || true
          c++filt --no-verbose -s rust < bench-data/results/smoke.perf.script > bench-data/results/smoke.demangled.perf.script
          c++filt --no-verbose -s rust < bench-data/results/smoke.main-inclusive.report > bench-data/results/smoke.main-inclusive.demangled.report
          grep -E 'JsLoaderContext|call_js_cb' bench-data/results/smoke.demangled.perf.script | head -6 | cut -c1-1200 || true
      - name: Diagnose native frame export
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess,collections,re
          r=pathlib.Path('bench-data/results')
          text=(r/'smoke.perf.script').read_text()
          demangled=(r/'smoke.demangled.perf.script').read_text()
          print('raw context text',text.count('JsLoaderContext'),'demangled context text',demangled.count('JsLoaderContext'))
          print('raw ModuleObject text',text.count('ModuleObject'),'raw callbacks',text.count('call_js_cb'))
          names=collections.Counter(line.strip().split(maxsplit=1)[1] for line in text.splitlines() if '.node)' in line and len(line.strip().split(maxsplit=1))==2)
          print('native frames',sum(names.values()),'top',names.most_common(10))
          syms=subprocess.check_output(['nm','--defined-only','bench-data/pack/rspack.linux-x64-gnu.node'],text=True).splitlines()
          selected=json.loads((r/'selected-symbols.json').read_text())
          for key,value in selected.items():
            if not value.get('defined'): continue
            matches=[s.split(maxsplit=2)[2] for s in syms if s.split()[0]==value['address']]
            for name in matches:
              print(key,'raw name',name,'raw occurrences',text.count(name),'demangle',subprocess.check_output(['c++filt','-s','rust',name],text=True).strip())
          print(subprocess.check_output(['readelf','-lW','bench-data/pack/rspack.linux-x64-gnu.node'],text=True))
          PY
      - name: Validate executing main thread frames
        run: |
          python3 - <<'PY'
          import json,pathlib,re
          r=pathlib.Path('bench-data/results')
          pid=json.loads((r/'perf.json').read_text())['pid']
          blocks=re.split(r'\n\s*\n',(r/'smoke.demangled.perf.script').read_text())
          main=[]
          for b in blocks:
            lines=b.splitlines()
            if lines and re.search(r'\s'+str(pid)+r'\s*/\s*'+str(pid)+r'\s',lines[0]): main.append(b)
          patterns={
            'context_to':r'^<rspack_binding_api::plugins::js_loader::context::JsLoaderContext as .*ToNapiValue>::to_napi_value',
            'context_from':r'^<rspack_binding_api::plugins::js_loader::context::JsLoaderContext as .*FromNapiValue>::from_napi_value',
            'module_to':r'^<rspack_binding_api::module::ModuleObject as .*ToNapiValue>::to_napi_value',
            'callback':r'^napi::threadsafe_function::call_js_cb(?:::)?<.*JsLoaderContext',
          }
          def hit(block,pattern):
            return any(len(line.strip().split(maxsplit=1))==2 and re.search(pattern,line.strip().split(maxsplit=1)[1]) for line in block.splitlines()[1:])
          counts={key:sum(hit(b,pattern) for b in main) for key,pattern in patterns.items()}
          examples={key:next((b for b in main if hit(b,pattern)),None) for key,pattern in patterns.items()}
          result={'pid':pid,'main_thread_samples':len(main),'inclusive_sample_counts':counts,'examples':examples}
          (r/'perf-main-thread.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          assert main,'no tid == pid samples parsed'
          assert all(counts[key] for key in ('context_to','context_from','callback')),counts
          assert json.loads((r/'overhead.json').read_text())['output_identical']
          PY
          (cd bench-data/pack && sha256sum -c SHA256SUMS)
      - name: Preserve delivery and resolved evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v229-symbolized-resolved
          path: |
            bench-data/pack/
            bench-data/results/
            bench-data/prepare.cjs
            bench-data/run.cjs
          compression-level: 1
