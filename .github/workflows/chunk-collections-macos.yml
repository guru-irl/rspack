name: Chunk collections macOS memory
on:
  push:
    branches: [bench/chunk-collections-macos]
permissions:
  contents: read
  actions: read
jobs:
  packs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repackage existing macOS frozen packs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .spider/scratch/repack
          gh run download 38056241596 --repo guru-irl/rspack --name chunk-collections-macos-packs --dir .spider/scratch/repack
          tar -czf .spider/scratch/chunk-collections-macos.tar.gz -C .spider/scratch/repack .
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-collections-macos-tar
          path: .spider/scratch/chunk-collections-macos.tar.gz
          include-hidden-files: true
  memory:
    needs: packs
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        size: [small, large]
        workload: [single, multi, no-reader]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/pnpm/setup
      - uses: actions/download-artifact@v4
        with:
          name: chunk-collections-macos-tar
          path: .spider/scratch
      - name: Calibrate and compare
        shell: bash
        env:
          SIZE: ${{ matrix.size }}
          WORKLOAD: ${{ matrix.workload }}
        run: |
          set -euo pipefail
          export BENCH_ROOT="$GITHUB_WORKSPACE/.spider/scratch/chunk-collections"
          export TMPDIR="$BENCH_ROOT/tmp"
          mkdir -p "$TMPDIR" "$BENCH_ROOT/results" "$BENCH_ROOT/logs"
          tar -xzf .spider/scratch/chunk-collections-macos.tar.gz -C "$BENCH_ROOT"
          pnpm install --frozen-lockfile
          for arm in base candidate; do
            ln -s "$GITHUB_WORKSPACE/packages/rspack/node_modules" "$BENCH_ROOT/packs/$arm/node_modules"
            ln -s "$GITHUB_WORKSPACE/packages/rspack/compiled" "$BENCH_ROOT/packs/$arm/compiled"
          done
          ln -s "$GITHUB_WORKSPACE/node_modules" "$BENCH_ROOT/node_modules"
          for rep in $(seq 1 56); do
            if (( rep % 2 )); then order='base baseprime'; else order='baseprime base'; fi
            for arm in $order; do node --expose-gc "$BENCH_ROOT/harness/bench.mjs" "$arm" "$SIZE" "$WORKLOAD" memory "aa-$rep" > "$BENCH_ROOT/logs/$SIZE-$WORKLOAD-aa-$rep-$arm.log" 2>&1; done
          done
          for rep in $(seq 1 7); do
            if (( rep % 2 )); then order='base candidate'; else order='candidate base'; fi
            for arm in $order; do node --expose-gc "$BENCH_ROOT/harness/bench.mjs" "$arm" "$SIZE" "$WORKLOAD" memory "ab-$rep" > "$BENCH_ROOT/logs/$SIZE-$WORKLOAD-ab-$rep-$arm.log" 2>&1; done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chunk-collections-macos-${{ matrix.size }}-${{ matrix.workload }}
          path: |
            .spider/scratch/chunk-collections/results
            .spider/scratch/chunk-collections/logs
          include-hidden-files: true
