name: v2.3.0 mixed workload smoke
on:
  push:
    branches: [bench/v230-mem4-m3-mixed-smoke]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  measure:
    name: Compare ${{ matrix.arm }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: mixed-aa
            profile: mixed
            run: '41730434649'
            artifact: v230-fix12r-binding
            evidence: v230-fix12r-evidence
            source: 179b41b93cd909fb434c722c9d37213388c5239e
            identical: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Wait for the candidate release run
        if: ${{ matrix.identical != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: timeout 5400s gh run watch '${{ matrix.run }}' --repo '${{ github.repository }}' --exit-status
      - uses: actions/download-artifact@v4
        with:
          name: v230-fix12r-binding
          path: bench-data/control
          run-id: 41730434649
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: bench-data/candidate
          run-id: ${{ matrix.run }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.evidence }}
          path: bench-data/candidate-evidence
          run-id: ${{ matrix.run }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - name: Verify candidate provenance
        run: |
          set -euo pipefail
          test "$(tr -d '\n' < bench-data/candidate-evidence/source.sha)" = '${{ matrix.source }}'
          expected=$(awk '$2 ~ /rspack.linux-x64-gnu.node$/ {print $1}' bench-data/candidate-evidence/pack.sha256)
          test -n "$expected"
          printf '%s  %s\n' "$expected" bench-data/candidate/rspack.linux-x64-gnu.node | sha256sum -c
      - name: Compare peak, steady RSS and build phases
        env:
          PROFILE: ${{ matrix.profile }}
          PAIRS: 5
          ALLOW_IDENTICAL: ${{ matrix.identical }}
        run: bash .github/scripts/pack-v230-mem4/measure.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v230-mem4-${{ matrix.arm }}-measure
          path: bench-data/results/
          if-no-files-found: error
          compression-level: 1
