name: v2.3.0 M3 callback order comparison
on:
  push:
    branches: [bench/v230-mem4-m3-safe-compare]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
env:
  SOURCE: b4aa409cf126d30a4dc3f94a8c4750f74f522c92
  RELEASE_RUN: '42293433698'
  CONTROL_RUN: '42290127457'
  CONTROL_SOURCE: a757666ff20b5a17aed5fe514c15c2e4bf245935
  CONTROL_BINDING: v230-m3-base-binding
  CONTROL_EVIDENCE: v230-m3-base-evidence
jobs:
  measure:
    name: Compare ${{ matrix.arm }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: m3-safe-rope
            profile: rope
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Wait for the candidate release run
        env:
          GH_TOKEN: ${{ github.token }}
        run: timeout 5400s gh run watch "$RELEASE_RUN" --repo '${{ github.repository }}' --exit-status
      - name: Wait for the control release run
        env:
          GH_TOKEN: ${{ github.token }}
        run: timeout 5400s gh run watch "$CONTROL_RUN" --repo '${{ github.repository }}'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CONTROL_BINDING }}
          path: bench-data/control
          run-id: ${{ env.CONTROL_RUN }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CONTROL_EVIDENCE }}
          path: bench-data/control-evidence
          run-id: ${{ env.CONTROL_RUN }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: v230-m3-binding
          path: bench-data/candidate
          run-id: ${{ env.RELEASE_RUN }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: v230-m3-evidence
          path: bench-data/candidate-evidence
          run-id: ${{ env.RELEASE_RUN }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - name: Verify candidate and control provenance
        run: |
          set -euo pipefail
          test "$(tr -d '\n' < bench-data/control-evidence/source.sha)" = "$CONTROL_SOURCE"
          control=$(awk '$2 ~ /rspack.linux-x64-gnu.node$/ {print $1}' bench-data/control-evidence/pack.sha256)
          test -n "$control"
          printf '%s  %s\n' "$control" bench-data/control/rspack.linux-x64-gnu.node | sha256sum -c
          printf 'EXPECTED_CONTROL=%s\n' "$control" >> "$GITHUB_ENV"
          test "$(tr -d '\n' < bench-data/candidate-evidence/source.sha)" = "$SOURCE"
          expected=$(awk '$2 ~ /rspack.linux-x64-gnu.node$/ {print $1}' bench-data/candidate-evidence/pack.sha256)
          test -n "$expected"
          printf '%s  %s\n' "$expected" bench-data/candidate/rspack.linux-x64-gnu.node | sha256sum -c
      - name: Compare peak, steady RSS and build phases
        env:
          PROFILE: ${{ matrix.profile }}
          PAIRS: 8
          REPORT_METRICS: edit2_rss_mib,edit2_devtool_collect_ms
        run: bash .github/scripts/pack-v230-mem4/measure.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v230-mem4-${{ matrix.arm }}-measure
          path: bench-data/results/
          if-no-files-found: error
          compression-level: 1
