name: SplitChunks Option B measurements
on:
  push:
    branches: [bench/split-chunks-option-b]
    paths: ['.github/workflows/bench-split-chunks-option-b.yml', 'scripts/split-chunks-option-b-bench/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: split-chunks-option-b-measurements
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: Linux, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, label: main, ref: f2903b6482cb7a0fcdca912d23062bd94d3d5636 }
          - { platform: Linux, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, label: old24, ref: 297daff0ace33197c5e89f1c06359a5a0274fb71 }
          - { platform: Linux, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, label: pr1, ref: 379a84ca907322486c58a575073f81d1e6790543 }
          - { platform: Linux, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, label: pr2, ref: c870aa3b16e628df78e8fb1575bec28c2c1fa6a4 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - name: Build exact production release source
        shell: bash
        env:
          SOURCE_REF: ${{ matrix.ref }}
          RUST_TARGET: ${{ matrix.target }}
        run: bash scripts/split-chunks-option-b-bench/build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optb-binding-${{ matrix.platform }}-${{ matrix.label }}
          path: .bench-split-chunks-option-b/artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  measure:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: Linux, runner: ubuntu-24.04 }
          - { platform: macOS, runner: macos-15 }
          - { platform: Windows, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - uses: actions/download-artifact@v4
        if: matrix.platform == 'Linux'
        with:
          pattern: optb-binding-Linux-*
          path: .bench-split-chunks-option-b/bindings/
      - uses: actions/download-artifact@v4
        if: matrix.platform != 'Linux'
        with:
          run-id: 38410411312
          github-token: ${{ github.token }}
          pattern: optb-binding-${{ matrix.platform }}-*
          path: .bench-split-chunks-option-b/bindings/
      - name: Measure alternating pairs with same-binary calibration
        shell: bash
        run: bash scripts/split-chunks-option-b-bench/measure.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optb-results-${{ matrix.platform }}
          path: .bench-split-chunks-option-b/results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
