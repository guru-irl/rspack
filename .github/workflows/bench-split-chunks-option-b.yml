name: Native watcher Linux final gates
on:
  push:
    branches: [bench/pr59-alias-xplat]
    paths: ['.github/workflows/bench-split-chunks-option-b.yml', 'bench/alias-xplat/**']
permissions:
  contents: read
  actions: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 3
      EXPECTED_BINDING_SHA256: d2f2cdfed938f1b451a440117d1ad46ec464de6515e57cd5c52231a29154bb3c
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set scratch paths
        run: |
          set -euo pipefail
          mkdir -p "$PWD/.bench-alias/tmp" "$PWD/.bench-alias/results"
          printf 'TMPDIR=%s\nCARGO_TARGET_DIR=%s\n' "$PWD/.bench-alias/tmp" "$PWD/.bench-alias/rust-target" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 90f41a8ac8200533cdc96aa31b4b818bf8a75561
          path: head
      - name: Verify source identity
        run: |
          set -euo pipefail
          test "$(git -C head rev-parse HEAD)" = 90f41a8ac8200533cdc96aa31b4b818bf8a75561
          test "$(git -C head rev-parse HEAD^{tree})" = 51f2676af734fbbbd3c17df49222e9c59ca65e7c
          git -C head show -s --format='%H %T %s' | tee .bench-alias/results/source.txt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Reuse the exact hosted dev binding
        uses: actions/download-artifact@v4
        with:
          name: alias-fixed-binding-Linux
          run-id: 41098959234
          github-token: ${{ github.token }}
          path: head/crates/node_binding
      - name: Install dependencies and build JavaScript
        working-directory: head
        run: pnpm install --frozen-lockfile && pnpm run build:js
      - name: Pin and check the reused binding
        run: |
          set -euo pipefail
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto"),assert=require("node:assert/strict"); const p=fs.realpathSync("head/crates/node_binding/rspack.linux-x64-gnu.node"),h=crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex"); assert.equal(h,process.env.EXPECTED_BINDING_SHA256); fs.appendFileSync(process.env.GITHUB_ENV,`NAPI_RS_NATIVE_LIBRARY_PATH=${p}\n`); console.log(JSON.stringify({binding:p,sha256:h,producer:41098959234}));' | tee .bench-alias/results/binding.json
      - name: Run compiler, API and watch cases with worker binding proof
        run: node bench/alias-xplat/case-gates.cjs head .bench-alias/results/gates linux
      - name: Install Rust
        run: rustup toolchain install nightly-2026-04-16 --profile minimal --component rustfmt --component clippy
      - name: Rust formatting, clippy and existing tests
        working-directory: head
        run: |
          set -euo pipefail
          cargo fmt --all --check > ../.bench-alias/results/fmt.log 2>&1
          cargo clippy -p rspack_watcher --all-targets -- -D warnings > ../.bench-alias/results/clippy.log 2>&1
          cargo test -p rspack_watcher > ../.bench-alias/results/rust.log 2>&1
          grep 'test result:' ../.bench-alias/results/rust.log
          printf 'PASS\n' > ../.bench-alias/results/rust-checks.txt
      - name: Check the source stayed unchanged
        run: git -C head diff --exit-code && git -C head diff --exit-code --cached
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alias-linux-final-gates
          path: .bench-alias/results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
