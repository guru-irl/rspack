name: SplitChunks Option B measurements
on:
  push:
    branches: [bench/split-chunks-option-b]
    paths: ['.github/workflows/bench-split-chunks-option-b.yml', 'scripts/split-chunks-option-b-bench/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: split-chunks-option-b-measurements
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: Linux, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, label: base38, ref: 3482b2a8876fbb570a260137933110ff352d0306 }
          - { platform: Linux, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, label: name1024, ref: 9f33615e8ddd9f1070dc3219f4d77f86993994d5 }
          - { platform: Linux, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, label: rounds, ref: f6e4ff3f55d54489301ecb0cee93bff17aec7eaa }
          - { platform: macOS, runner: macos-15, target: aarch64-apple-darwin, label: base38, ref: 3482b2a8876fbb570a260137933110ff352d0306 }
          - { platform: macOS, runner: macos-15, target: aarch64-apple-darwin, label: name1024, ref: 9f33615e8ddd9f1070dc3219f4d77f86993994d5 }
          - { platform: macOS, runner: macos-15, target: aarch64-apple-darwin, label: rounds, ref: f6e4ff3f55d54489301ecb0cee93bff17aec7eaa }
          - { platform: Windows, runner: windows-2025, target: x86_64-pc-windows-msvc, label: base38, ref: 3482b2a8876fbb570a260137933110ff352d0306 }
          - { platform: Windows, runner: windows-2025, target: x86_64-pc-windows-msvc, label: name1024, ref: 9f33615e8ddd9f1070dc3219f4d77f86993994d5 }
          - { platform: Windows, runner: windows-2025, target: x86_64-pc-windows-msvc, label: rounds, ref: f6e4ff3f55d54489301ecb0cee93bff17aec7eaa }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - name: Build exact production release source
        shell: bash
        env:
          SOURCE_REF: ${{ matrix.ref }}
          RUST_TARGET: ${{ matrix.target }}
        run: bash scripts/split-chunks-option-b-bench/build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optb-binding-${{ matrix.platform }}-${{ matrix.label }}
          path: .bench-split-chunks-option-b/artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  measure:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: Linux, runner: ubuntu-24.04 }
          - { platform: macOS, runner: macos-15 }
          - { platform: Windows, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          pattern: optb-binding-${{ matrix.platform }}-*
          path: .bench-split-chunks-option-b/bindings/
      - uses: actions/download-artifact@v4
        if: matrix.platform == 'Linux'
        with:
          run-id: 38412612623
          github-token: ${{ github.token }}
          name: optb-binding-Linux-old24
          path: .bench-split-chunks-option-b/bindings/optb-binding-Linux-old24/
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ matrix.platform == 'Linux' && '38412612623' || '38410411312' }}
          github-token: ${{ github.token }}
          name: optb-binding-${{ matrix.platform }}-main
          path: .bench-split-chunks-option-b/bindings/optb-binding-${{ matrix.platform }}-main/
      - name: Measure alternating pairs with same-binary calibration
        shell: bash
        env:
          BENCH_FOLLOWUPS: '1'
        run: bash scripts/split-chunks-option-b-bench/measure.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optb-results-${{ matrix.platform }}
          path: .bench-split-chunks-option-b/results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
