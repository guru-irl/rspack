name: PR59 wide-tree measurement controls
on:
  push:
    branches: [bench/pr59-xplat-memory]
    paths: ['.github/workflows/bench-split-chunks-option-b.yml', 'bench/wide-memory/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: pr59-wide-controls-${{ github.sha }}
  cancel-in-progress: false
jobs:
  controls:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: Linux, runner: ubuntu-latest }
          - { platform: macOS, runner: macos-latest }
          - { platform: Windows, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Set scratch paths
        run: |
          set -euo pipefail
          mkdir -p "$PWD/.bench-wide/tmp" "$PWD/.bench-wide/results"
          P="$PWD/.bench-wide/tmp"
          if [[ "$RUNNER_OS" == Windows ]]; then P="$(cygpath -w "$P")"; fi
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$P" "$P" "$P" >> "$GITHUB_ENV"
      - name: Check JavaScript syntax and generate exact fixtures
        run: |
          set -euo pipefail
          for file in bench/wide-memory/*.cjs; do node --check "$file"; done
          node bench/wide-memory/prepare.cjs | tee .bench-wide/results/fixtures.jsonl
      - name: Prove Windows directory handle counting
        if: runner.os == 'Windows'
        shell: powershell
        run: ./bench/wide-memory/observe.ps1 -SelfControl -Fixture (Resolve-Path .bench-wide/fixtures/wide).Path | Tee-Object -FilePath .bench-wide/results/directory-control.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wide-controls-${{ matrix.platform }}
          path: .bench-wide/results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
