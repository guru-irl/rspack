name: SplitChunks Option B measurements
on:
  push:
    branches: [bench/split-chunks-option-b]
    paths: ['.github/workflows/bench-split-chunks-option-b.yml', 'scripts/split-chunks-option-b-bench/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: split-chunks-option-b-measurements
  cancel-in-progress: false
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: Linux, runner: ubuntu-24.04, binding_run: 38412612623 }
          - { platform: macOS, runner: macos-15, binding_run: 38410411312 }
          - { platform: Windows, runner: windows-2025, binding_run: 38410411312 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      # Reuse the production bindings and matching JavaScript cores.
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ matrix.binding_run }}
          github-token: ${{ github.token }}
          name: optb-binding-${{ matrix.platform }}-main
          path: .bench-split-chunks-option-b/bindings/optb-binding-${{ matrix.platform }}-main/
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ matrix.binding_run }}
          github-token: ${{ github.token }}
          name: optb-binding-${{ matrix.platform }}-pr1
          path: .bench-split-chunks-option-b/bindings/optb-binding-${{ matrix.platform }}-pr1/
      - name: Measure alternating pairs with same-binary calibration
        shell: bash
        env:
          BENCH_NATIVE_FILTERS_ONLY: '1'
        run: bash scripts/split-chunks-option-b-bench/measure.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optb-results-${{ matrix.platform }}
          path: .bench-split-chunks-option-b/results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
