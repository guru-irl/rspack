name: PR59 initial metadata retention control
on:
  push:
    branches: [bench/pr59-xplat-memory]
    paths: ['.github/workflows/bench-split-chunks-option-b.yml', 'bench/wide-memory/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: pr59-metadata-control-${{ github.sha }}
  cancel-in-progress: false
jobs:
  controls:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: Linux, runner: ubuntu-latest }
          - { platform: macOS, runner: macos-latest }
          - { platform: Windows, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set scratch paths
        run: |
          set -euo pipefail
          mkdir -p "$PWD/.bench-wide/tmp" "$PWD/.bench-wide/results"
          P="$PWD/.bench-wide/tmp"
          if [[ "$RUNNER_OS" == Windows ]]; then P="$(cygpath -w "$P")"; fi
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$P" "$P" "$P" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 79c650c24e4b468e743ebfe6454b3b2bc6650938
          path: source
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          pattern: wide-binding-${{ matrix.platform }}-*
          run-id: 41106150672
          github-token: ${{ github.token }}
          path: .bench-wide/bindings/
      - name: Prove the initial result retains a native object
        env:
          BENCH_METADATA_RED: 1
        run: bash bench/wide-memory/measure.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: initial-metadata-red-${{ matrix.platform }}
          path: .bench-wide/results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
