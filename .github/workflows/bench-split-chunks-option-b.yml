name: PR59 single reference replacements and cost report
on:
  push:
    branches: [bench/pr59-xplat-cost-replacements]
    paths: ['.github/workflows/bench-split-chunks-option-b.yml', 'bench/cost-replacements/**', 'bench/wide-memory/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: pr59-cost-replacements-${{ github.sha }}
  cancel-in-progress: false
env:
  COST_SOURCE_SHA: 1810ebe4ca553451b1f4e6237095a0329da87436
jobs:
  retry:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: Linux, runner: ubuntu-latest }
          - { platform: macOS, runner: macos-latest }
          - { platform: Windows, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set scratch paths
        run: |
          set -euo pipefail
          mkdir -p "$PWD/.bench-wide/tmp" "$PWD/.bench-wide/results"
          P="$PWD/.bench-wide/tmp"
          if [[ "$RUNNER_OS" == Windows ]]; then P="$(cygpath -w "$P")"; fi
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$P" "$P" "$P" >> "$GITHUB_ENV"
      - name: Wait until the original measurement queue finishes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 41149287712 --repo guru-irl/rspack --interval 60
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 79c650c24e4b468e743ebfe6454b3b2bc6650938
          path: source
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          name: wide-results-${{ matrix.platform }}
          run-id: 41149287712
          github-token: ${{ github.token }}
          path: .bench-wide/original/
      - uses: actions/download-artifact@v4
        with:
          name: wide-binding-${{ matrix.platform }}-cost
          run-id: 41149287712
          github-token: ${{ github.token }}
          path: .bench-wide/bindings/wide-binding-${{ matrix.platform }}-cost/
      - uses: actions/download-artifact@v4
        with:
          pattern: wide-binding-${{ matrix.platform }}-*
          run-id: 41106150672
          github-token: ${{ github.token }}
          path: .bench-wide/bindings/
      - name: Replace each excluded reference cell once and audit native completeness
        run: |
          set -euo pipefail
          cp bench/cost-replacements/retry.cjs bench/wide-memory/measure.cjs
          bash bench/wide-memory/measure.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wide-results-${{ matrix.platform }}
          path: .bench-wide/results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  summarize:
    needs: retry
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - uses: actions/download-artifact@v4
        with:
          pattern: wide-results-*
          path: .bench-wide/collected/
      - name: Summarize paired native comparisons and reference failure counts
        run: node bench/wide-memory/cost-report.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cost-measurements
          path: .bench-wide/report/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
