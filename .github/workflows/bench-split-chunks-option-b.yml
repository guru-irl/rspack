name: PR base and head watch measurements
on:
  push:
    branches: [bench/pr66-merge-costs]
    paths: ['.github/workflows/bench-split-chunks-option-b.yml', 'scripts/split-chunks-option-b-bench/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: pr66-merge-costs
  cancel-in-progress: false
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: Linux, runner: ubuntu-24.04 }
          - { platform: macOS, runner: macos-15 }
          - { platform: Windows, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - name: Reuse the two production bindings
        uses: actions/download-artifact@v4
        with:
          pattern: optb-binding-${{ matrix.platform }}-*
          run-id: 40578412745
          github-token: ${{ github.token }}
          path: .bench-pr66-merge-costs/bindings/
      - name: Measure without rebuilding
        shell: bash
        run: bash scripts/split-chunks-option-b-bench/measure-merge.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merge-costs-${{ matrix.platform }}
          path: .bench-pr66-merge-costs/results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
