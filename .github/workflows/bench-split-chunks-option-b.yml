name: SplitChunks callback same-binding control
on:
  push:
    branches: [bench/split-chunks-type-layer-main-aa]
    paths: ['.github/workflows/bench-split-chunks-option-b.yml']
permissions:
  contents: read
  actions: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          run-id: 40284512350
          github-token: ${{ github.token }}
          name: optb-binding-Linux-main
          path: .bench-split-chunks-option-b/bindings/optb-binding-Linux-main/
      - name: Measure callback-only same-binding control
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/.bench-split-chunks-option-b"
          mkdir -p "$ROOT/scripts" "$ROOT/tmp" "$ROOT/fixture" "$ROOT/results"
          cp scripts/split-chunks-option-b-bench/* "$ROOT/scripts/"
          cp -R "$ROOT/bindings/optb-binding-Linux-main" "$ROOT/bindings/optb-binding-Linux-pr1"
          export TMPDIR="$ROOT/tmp"
          unset BENCH_NATIVE_FILTERS_ONLY
          pnpm install --frozen-lockfile > "$ROOT/results/install.log" 2>&1
          pnpm run build:js > "$ROOT/results/js-build.log" 2>&1
          cp "$ROOT/scripts/run.mjs" "$ROOT/scripts/gen.mjs" "$ROOT/fixture/"
          node "$ROOT/fixture/gen.mjs" --modules 60000
          python "$ROOT/scripts/paired_stats.py"
          python - "$ROOT" "$PWD" <<'PY'
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          path = root / 'scripts/series.py'
          source = path.read_text()
          arms = next(line for line in source.splitlines() if line.startswith('arms='))
          source = source.replace(arms, "arms=('callback',)", 1)
          sys.path.insert(0, str(root / 'scripts'))
          exec(compile(source, str(path), 'exec'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optb-callback-aa-results-Linux
          path: .bench-split-chunks-option-b/results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
