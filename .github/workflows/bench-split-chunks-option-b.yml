name: SplitChunks Option B measurements
on:
  push:
    branches: [bench/split-chunks-option-b]
    paths: ['.github/workflows/bench-split-chunks-option-b.yml', 'scripts/split-chunks-option-b-bench/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: split-chunks-option-b-measurements
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macOS, runner: macos-15, target: aarch64-apple-darwin, label: old24, ref: 297daff0ace33197c5e89f1c06359a5a0274fb71 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - name: Build exact production release source
        shell: bash
        env:
          SOURCE_REF: ${{ matrix.ref }}
          RUST_TARGET: ${{ matrix.target }}
        run: bash scripts/split-chunks-option-b-bench/build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optb-binding-${{ matrix.platform }}-${{ matrix.label }}
          path: .bench-split-chunks-option-b/artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  measure:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macOS, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          name: optb-binding-macOS-old24
          path: .bench-split-chunks-option-b/bindings/optb-binding-macOS-old24/
      - uses: actions/download-artifact@v4
        with:
          run-id: 38490941078
          github-token: ${{ github.token }}
          name: optb-binding-macOS-name1024
          path: .bench-split-chunks-option-b/bindings/optb-binding-macOS-name1024/
      - uses: actions/download-artifact@v4
        with:
          run-id: 38490941078
          github-token: ${{ github.token }}
          name: optb-binding-macOS-rounds
          path: .bench-split-chunks-option-b/bindings/optb-binding-macOS-rounds/
      - name: Measure alternating pairs with same-binary calibration
        shell: bash
        env:
          BENCH_FOLLOWUPS_REPLICATION: '1'
        run: bash scripts/split-chunks-option-b-bench/measure.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optb-results-${{ matrix.platform }}
          path: .bench-split-chunks-option-b/results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
