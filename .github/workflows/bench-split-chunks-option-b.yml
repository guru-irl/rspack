name: PR59 cross-platform memory and probe readiness
on:
  push:
    branches: [bench/pr59-xplat-memory]
    paths: ['.github/workflows/bench-split-chunks-option-b.yml', 'bench/wide-memory/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: pr59-wide-measure-${{ github.sha }}
  cancel-in-progress: false
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: Linux, runner: ubuntu-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set scratch paths
        run: |
          set -euo pipefail
          mkdir -p "$PWD/.bench-wide/tmp" "$PWD/.bench-wide/results"
          P="$PWD/.bench-wide/tmp"
          if [[ "$RUNNER_OS" == Windows ]]; then P="$(cygpath -w "$P")"; fi
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$P" "$P" "$P" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 79c650c24e4b468e743ebfe6454b3b2bc6650938
          path: source
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - name: Wait for this OS release receipts without cancelling builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: node bench/wide-memory/wait.cjs '${{ matrix.platform }}'
      - uses: actions/download-artifact@v4
        with:
          pattern: wide-binding-${{ matrix.platform }}-*
          run-id: 41106150672
          github-token: ${{ github.token }}
          path: .bench-wide/bindings/
      - name: Measure five alternating runs per arm and scenario
        run: bash bench/wide-memory/measure.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wide-results-${{ matrix.platform }}
          path: .bench-wide/results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  summarize:
    needs: measure
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set scratch paths
        run: |
          set -euo pipefail
          mkdir -p "$PWD/.bench-wide/tmp"
          printf 'TMPDIR=%s\n' "$PWD/.bench-wide/tmp" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - uses: actions/download-artifact@v4
        with:
          pattern: wide-results-*
          path: .bench-wide/collected/
      - name: Wait for retained macOS and Windows jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 41133890095 --repo guru-irl/rspack --interval 60
      - uses: actions/download-artifact@v4
        with:
          name: wide-results-macOS
          run-id: 41133890095
          github-token: ${{ github.token }}
          path: .bench-wide/collected/wide-results-macOS/
      - uses: actions/download-artifact@v4
        with:
          name: wide-results-Windows
          run-id: 41133890095
          github-token: ${{ github.token }}
          path: .bench-wide/collected/wide-results-Windows/
      - name: Assemble tables, identities and threshold checks
        run: node bench/wide-memory/report.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wide-memory-report
          path: .bench-wide/report/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
