name: Native watcher coalescing bounded-hash rerun
on:
  push:
    branches: [bench/native-watcher-coalesce-xplat]
    paths: ['.github/workflows/bench-split-chunks-option-b.yml', 'bench/coalesce-harness/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: native-watcher-coalesce-xplat
  cancel-in-progress: false
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: Linux, runner: ubuntu-latest }
          - { platform: macOS, runner: macos-latest }
          - { platform: Windows, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set scratch paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PWD/.bench-coalesce/tmp"
          P="$PWD/.bench-coalesce/tmp"
          if [[ "$RUNNER_OS" == Windows ]]; then P="$(cygpath -w "$P")"; fi
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$P" "$P" "$P" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e04e75e8a56d1a1d0a920e34e166dd91617b118f
          path: source
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - name: Reuse the two original release arms
        uses: actions/download-artifact@v4
        with:
          pattern: coalesce-binding-${{ matrix.platform }}-*
          run-id: 40870153481
          github-token: ${{ github.token }}
          path: .bench-coalesce/bindings/
      - name: Reuse the new release arm
        uses: actions/download-artifact@v4
        with:
          pattern: coalesce-binding-${{ matrix.platform }}-new
          run-id: 40878987905
          github-token: ${{ github.token }}
          path: .bench-coalesce/bindings/
      - name: Measure five alternating runs per arm and scenario
        shell: bash
        run: bash bench/coalesce-harness/measure.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coalesce-results-${{ matrix.platform }}
          path: .bench-coalesce/results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
