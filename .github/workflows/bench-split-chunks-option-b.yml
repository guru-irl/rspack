name: PR66 Windows memory ownership
on:
  workflow_dispatch:
  push:
    branches: [bench/native-watcher-pr66-windows-memory]
    paths: ['.github/workflows/bench-split-chunks-option-b.yml', 'scripts/split-chunks-option-b-bench/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: pr66-windows-memory-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  measure:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: Windows, runner: windows-2025, files: 40000, folders: 3000, applications: 4 }
          - { platform: Windows, runner: windows-2025, files: 80000, folders: 1000, applications: 4 }
          - { platform: Windows, runner: windows-2025, files: 80000, folders: 3000, applications: 4 }
          - { platform: Windows, runner: windows-2025, files: 80000, folders: 6000, applications: 4 }
          - { platform: Windows, runner: windows-2025, files: 160000, folders: 3000, applications: 4 }
          - { platform: Windows, runner: windows-2025, files: 80000, folders: 3000, applications: 1 }
          - { platform: Windows, runner: windows-2025, files: 80000, folders: 3000, applications: 5 }
          - { platform: Windows, runner: windows-2025, files: 80000, folders: 3000, applications: 20 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    env:
      M2_FILES: ${{ matrix.files }}
      M2_FOLDERS: ${{ matrix.folders }}
      M2_APPLICATIONS: ${{ matrix.applications }}
      MIMALLOC_SHOW_STATS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - name: Reuse the two production bindings
        uses: actions/download-artifact@v4
        with:
          pattern: optb-binding-${{ matrix.platform }}-*
          run-id: 40578412745
          github-token: ${{ github.token }}
          path: .bench-pr66-merge-costs/bindings/
      - name: Measure without rebuilding
        shell: bash
        run: bash scripts/split-chunks-option-b-bench/measure-windows-memory.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr66-memory-${{ matrix.files }}-${{ matrix.folders }}-${{ matrix.applications }}
          path: .bench-pr66-merge-costs/results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  summarize:
    if: github.event_name == 'push'
    needs: measure
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - uses: actions/download-artifact@v4
        with:
          pattern: pr66-memory-*
          path: .bench-pr66-memory-summary
      - name: Summarize all five-pair cells
        shell: bash
        run: node scripts/split-chunks-option-b-bench/summarize-windows-memory.cjs .bench-pr66-memory-summary --all
      - uses: actions/upload-artifact@v4
        with:
          name: pr66-memory-summary
          path: .bench-pr66-memory-summary/memory-summary.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  allocator-control:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { policy: default, delay: 1000 }
          - { policy: immediate, delay: 0 }
          - { policy: deferred, delay: 60000 }
    runs-on: windows-2025
    timeout-minutes: 100
    env:
      M2_FILES: 80000
      M2_FOLDERS: 3000
      M2_APPLICATIONS: 4
      MIMALLOC_SHOW_STATS: 1
      MIMALLOC_VERBOSE: 1
      MIMALLOC_PURGE_DELAY: ${{ matrix.delay }}
      MEMORY_ALLOCATOR_POLICY: ${{ matrix.policy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          pattern: optb-binding-Windows-*
          run-id: 40578412745
          github-token: ${{ github.token }}
          path: .bench-pr66-merge-costs/bindings/
      - name: Measure allocator-only control without rebuilding
        shell: bash
        run: bash scripts/split-chunks-option-b-bench/measure-windows-memory.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr66-allocator-${{ matrix.policy }}
          path: .bench-pr66-merge-costs/results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
