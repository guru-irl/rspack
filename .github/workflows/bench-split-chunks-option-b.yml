name: Native watcher retained-folder timing diagnostics
on:
  push:
    branches: [bench/pr59-c4fix-retained-timing]
    paths: ['.github/workflows/bench-split-chunks-option-b.yml', 'bench/c4b/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: native-watcher-retained-timing-${{ github.sha }}
  cancel-in-progress: false
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3, 4, 5]
        root: [real, link]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 124beab203d064b899d86b652d8b76b7ea12576a
          path: t-fix
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 360667e8f049fdea70d03e357e0018aa62553d23
          path: t-head
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 79c650c24e4b468e743ebfe6454b3b2bc6650938
          path: t-main
      - name: Verify source identity
        run: |
          set -euo pipefail
          mkdir -p .c4b/results
          check() { test "$(git -C t-$1 rev-parse HEAD)" = $2; test "$(git -C t-$1 rev-parse HEAD^{tree})" = $3; git -C t-$1 show -s --format="$1 %H %T %s" | tee -a .c4b/results/source.txt; }
          check fix 124beab203d064b899d86b652d8b76b7ea12576a 5420f948b72ceb83eccdf454d589470c37ae5440
          check head 360667e8f049fdea70d03e357e0018aa62553d23 3bafe42e2eae81274f30802126a499ecbb60da4a
          check main 79c650c24e4b468e743ebfe6454b3b2bc6650938 11587ee715e5c9122ae9b1a440dad97ff3489bcc
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify main producer and its logged SHA-256
        run: |
          set -euo pipefail
          test "$(gh run view 41202980589 -R ${{ github.repository }} --json conclusion -q .conclusion)" = success
          H=$(gh run view 41202980589 -R ${{ github.repository }} --log | grep -oE "[0-9a-f]{64}  crates/node_binding/[^ ]+[.]node" | head -1 | cut -c1-64)
          test ${#H} = 64
          echo "MAIN_BINDING_SHA256=$H" | tee -a "$GITHUB_ENV" .c4b/results/main-producer-sha.txt
      - uses: actions/download-artifact@v4
        with:
          name: c4fix-binding-Linux-head
          run-id: 41212550652
          github-token: ${{ github.token }}
          path: t-fix/crates/node_binding
      - uses: actions/download-artifact@v4
        with:
          name: c4fix-binding-Linux-base
          run-id: 41212550652
          github-token: ${{ github.token }}
          path: t-head/crates/node_binding
      - uses: actions/download-artifact@v4
        with:
          name: c4b-binding-Linux-main
          run-id: 41202980589
          github-token: ${{ github.token }}
          path: t-main/crates/node_binding
      - name: Install dependencies and build JavaScript
        run: |
          set -euo pipefail
          for t in fix head main; do (cd t-$t && pnpm install --frozen-lockfile && pnpm run build:js); done
          sha256sum t-*/crates/node_binding/*.node | tee -a .c4b/results/bindings.txt
      - name: Allow private user namespaces on this throwaway runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Repeat matched retained-folder inputs
        env:
          SEED: ${{ matrix.seed }}
          ROOT_KIND: ${{ matrix.root }}
        run: |
          set -euo pipefail
          export NSLIMIT=30 LIMIT_DIRS=40 PREFIX="$GITHUB_WORKSPACE/bench/c4b/nslimit.sh"
          mkdir -p "$GITHUB_WORKSPACE/.c4b/real"
          ln -sfn "$GITHUB_WORKSPACE/.c4b/real" "$GITHUB_WORKSPACE/.c4b/link"
          case "$SEED" in
            1) ARMS='fix head main';;
            2) ARMS='head main fix';;
            3) ARMS='main fix head';;
            4) ARMS='fix main head';;
            5) ARMS='main head fix';;
          esac
          for LIMIT_FILLERS in 21 20; do
            export LIMIT_FILLERS
            export C4_RETAINED_ROOT="$GITHUB_WORKSPACE/.c4b/$ROOT_KIND/retained-seed-$SEED-fill-$LIMIT_FILLERS"
            PHYSICAL="$GITHUB_WORKSPACE/.c4b/real/retained-seed-$SEED-fill-$LIMIT_FILLERS"
            for arm in $ARMS; do
              test ! -e "$PHYSICAL"
              printf '%s\t%s\t%s\t%s\t%s\n' "$SEED" "$ROOT_KIND" "$LIMIT_FILLERS" "$arm" "$C4_RETAINED_ROOT" | tee -a .c4b/results/inputs.tsv
              bash bench/c4b/arm.sh "$arm" adv-retained-folder.cjs "seed$SEED-f$LIMIT_FILLERS" "$ROOT_KIND" limitretain
              test -d "$PHYSICAL"
              mv -- "$PHYSICAL" "$PHYSICAL.completed-$arm"
            done
          done
      - name: Check source identity after the cases
        if: always()
        run: |
          set -euo pipefail
          test "$(git -C t-fix rev-parse HEAD) $(git -C t-fix rev-parse HEAD^{tree})" = '124beab203d064b899d86b652d8b76b7ea12576a 5420f948b72ceb83eccdf454d589470c37ae5440'
          test "$(git -C t-head rev-parse HEAD) $(git -C t-head rev-parse HEAD^{tree})" = '360667e8f049fdea70d03e357e0018aa62553d23 3bafe42e2eae81274f30802126a499ecbb60da4a'
          test "$(git -C t-main rev-parse HEAD) $(git -C t-main rev-parse HEAD^{tree})" = '79c650c24e4b468e743ebfe6454b3b2bc6650938 11587ee715e5c9122ae9b1a440dad97ff3489bcc'
      - name: Check for leftover processes
        if: always()
        run: ps -eo pid,etimes,args | grep -E 'node .*bench/c4b' | grep -v grep | tee .c4b/results/leftover.txt || echo none
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c4fix-retained-seed${{ matrix.seed }}-${{ matrix.root }}
          path: .c4b/results/
          if-no-files-found: error
          retention-days: 14
