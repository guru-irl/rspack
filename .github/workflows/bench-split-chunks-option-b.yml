name: Native watcher c4b main Linux binding
on:
  push:
    branches: [bench/pr59-c4b-mainbin]
    paths: ['.github/workflows/bench-split-chunks-option-b.yml']
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 79c650c24e4b468e743ebfe6454b3b2bc6650938
          path: head
      - name: Verify source identity
        run: |
          set -euo pipefail
          test "$(git -C head rev-parse HEAD)" = 79c650c24e4b468e743ebfe6454b3b2bc6650938
          test "$(git -C head rev-parse HEAD^{tree})" = 11587ee715e5c9122ae9b1a440dad97ff3489bcc
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust
        run: rustup toolchain install nightly-2026-04-16 --profile minimal
      - name: Install dependencies
        working-directory: head
        run: pnpm install --frozen-lockfile
      - name: Build development binding
        working-directory: head
        run: pnpm run build:binding:dev && sha256sum crates/node_binding/*.node
      - uses: actions/upload-artifact@v4
        with:
          name: c4b-binding-Linux-main
          path: head/crates/node_binding/*.node
          if-no-files-found: error
