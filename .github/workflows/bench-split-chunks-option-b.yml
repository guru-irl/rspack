name: Native watcher c3 cross-platform verification, round 2
on:
  push:
    branches: [bench/pr59-c3-xplat2]
    paths: ['.github/workflows/bench-split-chunks-option-b.yml', 'bench/alias-xplat/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: native-watcher-c3-2-${{ github.sha }}
  cancel-in-progress: false
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macOS, runner: macos-latest, arm: head, sha: 6433cb8ccfef1ab755d0510a089446be417fae67, binding: 34a9f11bea8537c800d7186ae35bf929609707e5ab1b76afb703478fd323a5c0 }
          - { platform: macOS, runner: macos-latest, arm: main, sha: 79c650c24e4b468e743ebfe6454b3b2bc6650938, binding: a6d5dada3b620e60b699daa6ff12a20380872d4d9dbb05501dccb4b37b36eb27 }
          - { platform: Windows, runner: windows-latest, arm: head, sha: 6433cb8ccfef1ab755d0510a089446be417fae67, binding: bf1b43398c4871400f77b777adf9b1c0b59d63be83edce8fa6d84ac017e61d94 }
          - { platform: Windows, runner: windows-latest, arm: main, sha: 79c650c24e4b468e743ebfe6454b3b2bc6650938, binding: 8fd99b58b2eddf181dfc2dd10c660f0c72bc96a1a34ca275acb65bbfe54197ed }
          - { platform: Linux, runner: ubuntu-latest, arm: head, sha: 6433cb8ccfef1ab755d0510a089446be417fae67, binding: 844f065c3adf1c138bb7840cc598afba18359c51a90ff2b69eb5474e2e033421 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set scratch paths
        run: |
          set -euo pipefail
          mkdir -p "$PWD/.bench-alias/tmp" "$PWD/.bench-alias/results"
          P="$PWD/.bench-alias/tmp"
          if [[ "$RUNNER_OS" == Windows ]]; then P="$(cygpath -w "$P")"; fi
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$P" "$P" "$P" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.sha }}
          path: head
      - name: Verify source identity
        run: |
          set -euo pipefail
          test "$(git -C head rev-parse HEAD)" = ${{ matrix.sha }}
          git -C head show -s --format='%H %T %s' | tee .bench-alias/results/source.txt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Reuse the binding built in run 41170523541
        uses: actions/download-artifact@v4
        with:
          name: c3-binding-${{ matrix.platform }}-${{ matrix.arm }}
          run-id: 41170523541
          github-token: ${{ github.token }}
          path: head/crates/node_binding
      - name: Install dependencies and build JavaScript
        working-directory: head
        run: pnpm install --frozen-lockfile && pnpm run build:js
      - name: Pin and check the reused binding
        run: |
          set -euo pipefail
          PIN="$(find "$PWD/head/crates/node_binding" -name '*.node' -type f)"
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto"),assert=require("node:assert/strict"); const p=fs.realpathSync.native(process.argv[1]),h=crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex"); assert.equal(h,process.argv[2]); fs.appendFileSync(process.env.GITHUB_ENV,`NAPI_RS_NATIVE_LIBRARY_PATH=${p}\nEXPECTED_BINDING_SHA256=${h}\n`); console.log(JSON.stringify({binding:p,sha256:h,producer:41170523541}));' "$PIN" ${{ matrix.binding }} | tee .bench-alias/results/binding.json
      - name: Run the round 2 steps on the native watcher and on Watchpack
        run: |
          set -uo pipefail
          R=.bench-alias/results
          run() {
            local tag=$1; shift
            rc=0; env "$@" node bench/alias-xplat/c3-steps.cjs head ${{ matrix.arm }} $R/$tag-${{ matrix.arm }}.jsonl > $R/$tag-${{ matrix.arm }}.log 2>&1 || rc=$?; echo "$tag native rc=$rc"
            rc=0; env "$@" node bench/alias-xplat/c3-steps.cjs head wp $R/$tag-wp.jsonl > $R/$tag-wp.log 2>&1 || rc=$?; echo "$tag wp rc=$rc"
            node bench/alias-xplat/c3-compare.cjs $R/$tag-${{ matrix.arm }}.jsonl $R/$tag-wp.jsonl | tee $R/$tag-compare.log
          }
          run r2 C3_ONLY=rootlink
          if [[ "$RUNNER_OS" == Windows ]]; then run r2dir C3_ONLY=chain,retarget,rootlink,rootcycle C3_LINKTYPE=dir; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3r2-${{ matrix.platform }}-${{ matrix.arm }}
          path: .bench-alias/results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
