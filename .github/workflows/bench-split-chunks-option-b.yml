name: Native watcher alias fixed verification
on:
  push:
    branches: [bench/pr59-alias-xplat]
    paths: ['.github/workflows/bench-split-chunks-option-b.yml', 'bench/alias-xplat/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: native-watcher-alias-fixed-${{ github.sha }}
  cancel-in-progress: false
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: Linux, runner: ubuntu-latest }
          - { platform: macOS, runner: macos-latest }
          - { platform: Windows, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 3
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set scratch paths
        run: |
          set -euo pipefail
          mkdir -p "$PWD/.bench-alias/tmp" "$PWD/.bench-alias/results"
          P="$PWD/.bench-alias/tmp"
          if [[ "$RUNNER_OS" == Windows ]]; then P="$(cygpath -w "$P")"; fi
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$P" "$P" "$P" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5feaeab46c42dadc94772cc779478f129223cb0a
          path: head
      - name: Verify source identity
        run: |
          set -euo pipefail
          test "$(git -C head rev-parse HEAD)" = 5feaeab46c42dadc94772cc779478f129223cb0a
          test "$(git -C head rev-parse HEAD^{tree})" = db83df66b5a2bb02b5612937f392c0806867e744
          git -C head show -s --format='%H %T %s' | tee .bench-alias/results/source.txt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Repair Rust proxies on macOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --retry 5 -fsSL https://sh.rustup.rs | sh -s -- --default-toolchain none -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install Rust
        run: rustup toolchain install nightly-2026-04-16 --profile minimal
      - name: Install dependencies
        working-directory: head
        run: pnpm install --frozen-lockfile
      - name: Build development binding
        working-directory: head
        run: pnpm run build:binding:dev
      - name: Build JavaScript
        working-directory: head
        run: pnpm run build:js
      - uses: actions/upload-artifact@v4
        with:
          name: alias-fixed-binding-${{ matrix.platform }}
          path: head/crates/node_binding/*.node
          if-no-files-found: error
      - name: Pin the fixed binding
        run: |
          set -euo pipefail
          PIN="$(find "$PWD/head/crates/node_binding" -name '*.node' -type f)"
          node -e 'const fs=require("node:fs"),path=require("node:path"),crypto=require("node:crypto"); const p=fs.realpathSync(process.argv[1]),h=crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex"); fs.appendFileSync(process.env.GITHUB_ENV,`NAPI_RS_NATIVE_LIBRARY_PATH=${p}\nEXPECTED_BINDING_SHA256=${h}\n`); console.log(JSON.stringify({binding:p,sha256:h}));' "$PIN" | tee .bench-alias/results/binding.json
      - name: Compare fixed alias steps with Watchpack
        run: |
          set -euo pipefail
          node bench/alias-xplat/reference.cjs head fixed .bench-alias/results/fixed.jsonl
          node bench/alias-xplat/reference.cjs head wp .bench-alias/results/wp.jsonl
          node bench/alias-xplat/audit-reference.cjs .bench-alias/results --controls --require-parity=fixed | tee .bench-alias/results/audit.log
      - name: Run native watcher compiler cases with worker binding proof
        run: node bench/alias-xplat/case-gates.cjs head .bench-alias/results/gates compiler
      - name: Check the source stayed unchanged
        run: git -C head diff --exit-code && git -C head diff --exit-code --cached
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alias-fixed-${{ matrix.platform }}
          path: .bench-alias/results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
