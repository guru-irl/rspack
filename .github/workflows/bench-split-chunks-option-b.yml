name: Native watcher retained-folder trace binding
on:
  push:
    branches: [bench/pr59-c4fix-retained-trace-build]
    paths: ['.github/workflows/bench-split-chunks-option-b.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: native-watcher-retained-trace-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '3'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f5e65e52aacd95c81ecca94a7756c269db6e9420
          path: head
      - name: Verify trace source identity
        run: |
          set -euo pipefail
          mkdir -p results
          test "$(git -C head rev-parse HEAD)" = f5e65e52aacd95c81ecca94a7756c269db6e9420
          test "$(git -C head rev-parse HEAD^{tree})" = e78306170af3857aa0e9d948020613a48d2f1471
          git -C head show -s --format='%H %T %s' | tee results/source.txt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: rui314/setup-mold@v1
      - name: Build the trace-only binding
        working-directory: head
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run build:binding:dev
          B=$(find crates/node_binding -maxdepth 1 -name '*.node' -type f | head -1)
          test -n "$B"
          sha256sum "$B" | tee ../results/binding-sha.txt
          git diff --exit-code
          test "$(git rev-parse HEAD) $(git rev-parse HEAD^{tree})" = 'f5e65e52aacd95c81ecca94a7756c269db6e9420 e78306170af3857aa0e9d948020613a48d2f1471'
      - uses: actions/upload-artifact@v4
        with:
          name: c4fix-trace-binding-Linux
          path: head/crates/node_binding/*.node
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c4fix-trace-build-proof
          path: results/
          if-no-files-found: error
          retention-days: 14
