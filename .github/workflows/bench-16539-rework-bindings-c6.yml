name: Nested context rework binding producer
on:
  push:
    branches: [bench/16539-rework-bindings-c6-20261113]
    paths: ['.github/workflows/bench-16539-rework-bindings-c6.yml', 'bench/alias-xplat/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: rework-16539-c6-xplat-${{ github.sha }}
  cancel-in-progress: false
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 3
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 85a9d771e22b5b9edd6239e4a73ccc540f5db2b1
      - name: Check source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 85a9d771e22b5b9edd6239e4a73ccc540f5db2b1
          test "$(git rev-parse HEAD^{tree})" = a3f66e2b553fbcf8fca096f7aafe4020023742df
          mkdir -p .bench-results
          git show -s --format='%H %T %s' | tee .bench-results/source.txt
      - name: Install edition 2024 toolchain
        run: rustup toolchain install nightly-2026-04-16 --profile minimal --component rustfmt --component clippy
      - name: Format check
        run: set -o pipefail; cargo fmt --all --check 2>&1 | tee .bench-results/fmt.log
      - name: Clippy
        if: always()
        run: set -o pipefail; cargo clippy -p rspack_watcher -p rspack_watcher_testing --all-targets -- -D warnings 2>&1 | tee .bench-results/clippy.log
      - name: Cargo tests including rename_aggregation and rename_events
        if: always()
        run: set -o pipefail; cargo test -p rspack_watcher -p rspack_watcher_testing 2>&1 | tee .bench-results/cargo-test.log
      - name: Source remains unchanged
        if: always()
        run: git diff --exit-code && git diff --exit-code --cached
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rework-16539-c6-rust
          path: .bench-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macOS, runner: macos-latest, arm: head, sha: 85a9d771e22b5b9edd6239e4a73ccc540f5db2b1, tree: a3f66e2b553fbcf8fca096f7aafe4020023742df }
          - { platform: Windows, runner: windows-latest, arm: head, sha: 85a9d771e22b5b9edd6239e4a73ccc540f5db2b1, tree: a3f66e2b553fbcf8fca096f7aafe4020023742df }
          - { platform: Linux, runner: ubuntu-latest, arm: head, sha: 85a9d771e22b5b9edd6239e4a73ccc540f5db2b1, tree: a3f66e2b553fbcf8fca096f7aafe4020023742df }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 3
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set scratch paths
        run: |
          set -euo pipefail
          mkdir -p "$PWD/.bench-alias/tmp" "$PWD/.bench-alias/results"
          P="$PWD/.bench-alias/tmp"
          if [[ "$RUNNER_OS" == Windows ]]; then P="$(cygpath -w "$P")"; fi
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$P" "$P" "$P" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.sha }}
          path: head
      - name: Verify source identity
        run: |
          set -euo pipefail
          test "$(git -C head rev-parse HEAD)" = ${{ matrix.sha }}
          test "$(git -C head rev-parse HEAD^{tree})" = ${{ matrix.tree }}
          git -C head show -s --format='%H %T %s' | tee .bench-alias/results/source.txt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Repair Rust proxies on macOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --retry 5 -fsSL https://sh.rustup.rs | sh -s -- --default-toolchain none -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install Rust
        run: rustup toolchain install nightly-2026-04-16 --profile minimal
      - name: Install dependencies
        working-directory: head
        run: pnpm install --frozen-lockfile
      - name: Build development binding
        working-directory: head
        run: pnpm run build:binding:dev
      - name: Build JavaScript
        working-directory: head
        run: pnpm run build:js
      - name: Pin the binding
        run: |
          set -euo pipefail
          PIN="$(find "$PWD/head/crates/node_binding" -name '*.node' -type f)"
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto"); const p=fs.realpathSync.native(process.argv[1]),h=crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex"); fs.appendFileSync(process.env.GITHUB_ENV,`NAPI_RS_NATIVE_LIBRARY_PATH=${p}\nEXPECTED_BINDING_SHA256=${h}\n`); console.log(JSON.stringify({binding:p,sha256:h}));' "$PIN" | tee .bench-alias/results/binding.json
      - uses: actions/upload-artifact@v4
        with:
          name: rework-16539-c6-binding-${{ matrix.platform }}-${{ matrix.arm }}
          path: head/crates/node_binding/*.node
          if-no-files-found: error
      - name: Check source stayed unchanged
        if: always()
        run: git -C head diff --exit-code && git -C head diff --exit-code --cached
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rework-16539-c6-${{ matrix.platform }}-${{ matrix.arm }}
          path: .bench-alias/results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
