name: Bench SplitChunks Name Once
on:
  push:
    branches: ['bench/split-chunks-name-once']
    paths:
      - '.github/workflows/bench-split-chunks-reuse.yml'
      - 'benchmarks/split-chunks-reuse/**'
permissions:
  contents: read
  actions: read
jobs:
  macos-memory:
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.1'
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: a1-source-macos-15-main
          path: source-artifacts/main
          run-id: 38114499302
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: a1-source-macos-15-main-a1
          path: source-artifacts/main-a1
          run-id: 38114499302
          github-token: ${{ github.token }}
      - name: Install public fixture and monitor
        shell: bash
        run: |
          python -m pip install psutil==7.2.0
          cd benchmarks/split-chunks-reuse
          npm install --ignore-scripts --registry=https://registry.npmjs.org
      - name: Paired memory and equal-sized A/A controls
        run: python benchmarks/split-chunks-reuse/a1-run.py memory
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: split-chunks-a1-macos-15-${{ github.run_id }}
          path: |
            .spider/scratch/split-chunks-name-once/**/*.json
            .spider/scratch/split-chunks-name-once/**/*.log
            .spider/scratch/split-chunks-name-once/**/*.csv
            !.spider/scratch/split-chunks-name-once/**/node_modules/**
            !.spider/scratch/split-chunks-name-once/**/dist/**
            !.spider/scratch/split-chunks-name-once/**/src/**
          retention-days: 14
