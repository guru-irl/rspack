name: Bench SplitChunks Combinator
on:
  push:
    branches: ['bench/split-chunks-combinator']
    paths:
      - '.github/workflows/bench-split-chunks-reuse.yml'
      - 'benchmarks/split-chunks-reuse/**'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      matrix:
        include:
          - arm: 'off'
            ref: 2e71aeb6b7ee402571fb72a380cadbeaf3457d2d
          - arm: 'on'
            ref: 5d27d821b69d1619412ae17a22dc7be937b79561
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
      - uses: ./.github/actions/pnpm/setup
        with:
          node-version: '24'
      - uses: xc2/free-disk-space@fbe203b3788f2bebe2c835a15925da303eaa5efe
        with:
          tool-cache: false
      - uses: ./.github/actions/rustup
        with:
          key: split-chunks-stage0-release
          save-if: true
      - name: Build pinned source binding and matching JS
        run: |
          mkdir -p .spider/scratch/split-chunks-combinator/tmp
          export TMPDIR="$PWD/.spider/scratch/split-chunks-combinator/tmp"
          pnpm install --frozen-lockfile
          cargo codegen
          cargo fmt --all
          pnpm run build:binding:release
          pnpm --filter @rspack/core run build
          cargo fmt --all -- --check
          mkdir -p source-result/core source-result/binding
          cp -a packages/rspack/dist packages/rspack/compiled source-result/core/
          cp crates/node_binding/binding.js crates/node_binding/rspack.linux-x64-gnu.node source-result/binding/
          git rev-parse HEAD > source-result/head.txt
          echo '8b5ea6ac2e' > source-result/base.txt
          rustc -Vv > source-result/toolchain.txt
          sha256sum source-result/binding/*.node > source-result/native-sha256.txt
          git diff > source-result/build-generated.diff
      - uses: actions/upload-artifact@v4
        with:
          name: combinator-source-${{ matrix.arm }}
          path: source-result
          retention-days: 14
  measure:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.1'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: combinator-source-off
          path: source-artifacts/off
      - uses: actions/download-artifact@v4
        with:
          name: combinator-source-on
          path: source-artifacts/on
      - name: Install published harness dependencies
        working-directory: benchmarks/split-chunks-reuse
        run: npm install --ignore-scripts --registry=https://registry.npmjs.org
      - name: Serial interleaved fresh processes
        run: bash benchmarks/split-chunks-reuse/combinator-run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: split-chunks-combinator-${{ github.run_id }}
          path: .spider/scratch/split-chunks-combinator/results
          retention-days: 14
