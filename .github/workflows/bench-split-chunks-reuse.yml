name: Bench SplitChunks Name Once
on:
  push:
    branches: ['bench/split-chunks-name-once']
    paths:
      - '.github/workflows/bench-split-chunks-reuse.yml'
      - 'benchmarks/split-chunks-reuse/**'
permissions:
  contents: read
jobs:
  measure:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '4'
      RUST_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          ref: f2903b6482cb7a0fcdca912d23062bd94d3d5636
          fetch-depth: 0
      - uses: ./.github/actions/pnpm/setup
        with:
          node-version: '24'
      - uses: xc2/free-disk-space@fbe203b3788f2bebe2c835a15925da303eaa5efe
        if: runner.os == 'Linux'
        with:
          tool-cache: false
      - uses: ./.github/actions/rustup
        with:
          key: split-chunks-a1-in-runner-${{ matrix.target }}
          save-if: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build release arms on measurement runner without uploading binaries
        shell: bash
        run: bash benchmarks/split-chunks-reuse/a1-build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.1'
          registry-url: https://registry.npmjs.org
      - name: Install public fixture
        shell: bash
        run: |
          python -m pip install psutil==7.2.0
          cd benchmarks/split-chunks-reuse
          npm install --ignore-scripts --registry=https://registry.npmjs.org
      - name: Paired memory and equal-sized A/A controls
        run: python benchmarks/split-chunks-reuse/a1-run.py memory
      - name: Switch to phase-timed bindings and run interleaved timing arms
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for dir in source-artifacts/*; do cp "$dir"/timing/*.node "$dir/binding/"; done
          python benchmarks/split-chunks-reuse/a1-run.py timing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: split-chunks-a1-${{ matrix.os }}-${{ github.run_id }}
          path: |
            .spider/scratch/split-chunks-name-once/**/*.json
            .spider/scratch/split-chunks-name-once/**/*.csv
            .spider/scratch/split-chunks-name-once/**/*.log
            .spider/scratch/split-chunks-name-once/**/*.txt
            !.spider/scratch/split-chunks-name-once/**/node_modules/**
            !.spider/scratch/split-chunks-name-once/**/dist/**
            !.spider/scratch/split-chunks-name-once/**/src/**
          retention-days: 14
