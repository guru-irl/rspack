name: Function filename macOS arm64
on:
  push:
    branches: [bench/filename-fn-r-macos]
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: Matched release artifact (${{ matrix.arm }})
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arm: [base, R]
    steps:
      - uses: actions/checkout@v4
      # Source-pinned base/R release builds completed in their separate jobs.
      - uses: actions/download-artifact@v4
        with:
          name: filename-macos-${{ matrix.arm }}
          path: .spider/scratch/filename-macos/arms/${{ matrix.arm }}
          run-id: 38017691148
          github-token: ${{ github.token }}
      - name: Verify source and binary
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/.spider/scratch/filename-macos/arms/${{ matrix.arm }}"
          REF=768106154a993f955304099f18684fe9b1f52bb8
          if [ '${{ matrix.arm }}' = R ]; then REF=a061e88c96636ff53d24ac30eeb994c53058247d; fi
          test "$(cat "$ROOT/source.sha")" = "$REF"
          shasum -a 256 "$ROOT/native.node"
      - uses: actions/upload-artifact@v4
        with:
          name: filename-macos-${{ matrix.arm }}
          path: .spider/scratch/filename-macos/arms/${{ matrix.arm }}/
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
  measure:
    name: Interleaved function filename triples
    needs: build
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.26.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: filename-macos-base
          path: .spider/scratch/filename-macos/arms/base
      - uses: actions/download-artifact@v4
        with:
          name: filename-macos-R
          path: .spider/scratch/filename-macos/arms/R
      - name: Measure and check output parity
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          ROOT="$GITHUB_WORKSPACE/.spider/scratch/filename-macos"
          mkdir -p "$ROOT/tmp"
          export TMPDIR="$ROOT/tmp"
          NODE_HOME="$(dirname "$(dirname "$(command -v node)")")"
          test -f "$NODE_HOME/include/node/node_api.h"
          clang -O2 -bundle -undefined dynamic_lookup -DNODE_GYP_MODULE_NAME=footprint -I"$NODE_HOME/include/node" .github/scripts/filename-fn-macos/footprint.c -o "$ROOT/footprint.node"
          for ARM in base R; do
            for ITEM in "$GITHUB_WORKSPACE/packages/rspack/"*; do
              BASE="$(basename "$ITEM")"
              if [ "$BASE" != dist ]; then ln -s "$ITEM" "$ROOT/arms/$ARM/packages/rspack/$BASE"; fi
            done
          done
          node .github/scripts/filename-fn-macos/fixture.cjs "$ROOT/fixture"
          python3 .github/scripts/filename-fn-macos/measure.py "$ROOT" > "$ROOT/measurement.log" 2>&1
          printf 'Report: %s\n' "$ROOT/macos-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filename-macos-results
          path: .spider/scratch/filename-macos/
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
