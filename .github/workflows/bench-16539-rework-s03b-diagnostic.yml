name: Retained context quota native-state diagnosis
on:
  push:
    branches: [bench/16539-rework-s03b-diagnostic-20261113]
    paths: ['.github/workflows/bench-16539-rework-s03b-diagnostic.yml', 'bench/rework-16539/**']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arm: main, sha: bc5d3f90c577c7f7535524abe9b9235d62df00bd, run: 43382967596, binding: rework-16539-binding-Linux-main}
          - {arm: c7, sha: 0e23cb1000ad65cf01f4e71867bd10deb57a1030, run: 43411803086, binding: rework-16539-c7-binding-Linux-head}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 3
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.sha }}
          path: source
      - name: Set scratch paths
        run: |
          mkdir -p .diag/results .diag/tmp
          echo "TMPDIR=$PWD/.diag/tmp" >> "$GITHUB_ENV"
          git -C source show -s --format='%H %T %s' > .diag/results/source.txt
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.binding }}
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
          path: source/crates/node_binding
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build source-matched JavaScript
        working-directory: source
        run: pnpm install --frozen-lockfile && pnpm run build:js
      - name: Allow private user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Observe the unmodified binding
        run: bash bench/rework-16539/run-s03b.sh ${{ matrix.arm }} original
      - name: Add state logging only
        run: |
          python3 bench/rework-16539/instrument-s03b.py source
          git -C source diff > .diag/results/logging-only.patch
      - name: Install Rust
        run: rustup toolchain install nightly-2026-04-16 --profile minimal
      - name: Build logging-only development binding
        working-directory: source
        run: pnpm run build:binding:dev
      - name: Observe analyzer and optional state
        run: bash bench/rework-16539/run-s03b.sh ${{ matrix.arm }} logged
      - name: Verify matching manifests and failures
        run: |
          node -e 'const fs=require("node:fs"),a=require("node:assert/strict"); const rows=k=>fs.readFileSync(`.diag/results/${k}.jsonl`,"utf8").split("\n").filter(l=>l.startsWith("{")).map(JSON.parse); const x=rows("original"),y=rows("logged"); const summaries=r=>r.filter(v=>v.type==="summary"); a.equal(summaries(x).length,1);a.equal(summaries(y).length,1);a.equal(summaries(x)[0].rows,8);a.equal(summaries(y)[0].rows,8);a.deepEqual(summaries(x)[0].failed,summaries(y)[0].failed);for(const r of [x,y]){a.equal(r.filter(v=>v.type==="identity").length,1);a(!r.some(v=>["failure","unsettled","recovery-timeout"].includes(v.type)));}console.log(JSON.stringify({original:summaries(x),logged:summaries(y)}));' | tee .diag/results/comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retained-native-state-${{ matrix.arm }}
          path: .diag/results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
