name: Cache slow-disk bindings

on:
  push:
    branches: [bench/newcache-e-slowdisk]

permissions:
  contents: read
  actions: read

jobs:
  probe:
    if: github.repository == 'guru-irl/rspack'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.26.0'
          run_install: false
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: slowdisk-binding-round3
          path: artifacts
          run-id: 37869022928
          github-token: ${{ github.token }}
      - name: Verify existing artifacts and generate fixture
        run: |
          set -euo pipefail
          mkdir -p results results/temp slow-mount
          sha256sum --check artifacts/round3-hash.txt
          sha256sum --check artifacts/javascript-hash.txt
          test "$(tr -d '\n' < artifacts/round3-sha.txt)" = 6f6f7a9076d8b76c43e4c46be024fded987396f7
          tar -xzf artifacts/javascript.tar.gz
          git rev-parse HEAD > results/measurement-sha.txt
          FIXTURE="$GITHUB_WORKSPACE/fixture" node .github/scripts/cache-slowdisk/gen.mjs 60000
      - name: Prepare dm-delay device
        run: bash .github/scripts/cache-slowdisk/device.sh setup
      - name: Seed and probe
        run: |
          set -euo pipefail
          export TMPDIR="$GITHUB_WORKSPACE/results/temp"
          export FIXTURE="$GITHUB_WORKSPACE/fixture"
          export RSPACK_CORE="$GITHUB_WORKSPACE/packages/rspack/dist/index.js"
          export CACHE_DIR="$GITHUB_WORKSPACE/slow-mount/seed"
          export NAPI_RS_NATIVE_LIBRARY_PATH="$GITHUB_WORKSPACE/artifacts/round3.node"
          node .github/scripts/cache-slowdisk/run.mjs seed > results/seed.stdout.log 2> results/seed.stderr.log
          sync
          python3 .github/scripts/cache-slowdisk/probe.py slow-mount/seed slow-mount/probe results | tee results/probe.log
      - name: Cleanup
        if: always()
        run: bash .github/scripts/cache-slowdisk/device.sh cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slowdisk-probe-results
          path: results/
          retention-days: 14
