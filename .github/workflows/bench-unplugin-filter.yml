name: Synthetic unplugin filter benchmark
on:
  push:
    branches: [bench/unplugin-filter-u2]
permissions:
  contents: read
concurrency:
  group: synthetic-unplugin-filter-u2
  cancel-in-progress: false
jobs:
  source-validation:
    if: github.repository == 'guru-irl/rspack'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: bench/unplugin-filter
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: bench/unplugin-filter
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Build, lint, typecheck and run full upstream test suite
        run: bash validate-source.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unplugin-u2r2-source
          path: bench/unplugin-filter/source-results/
          retention-days: 30
