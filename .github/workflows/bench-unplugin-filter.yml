name: Synthetic unplugin filter benchmark
on:
  push:
    branches: [bench/unplugin-filter-u2]
permissions:
  contents: read
concurrency:
  group: synthetic-unplugin-filter-u2
  cancel-in-progress: false
jobs:
  benchmark:
    if: github.repository == 'guru-irl/rspack'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: bench/unplugin-filter
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: bench/unplugin-filter
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Install released packages
        run: npm install --workspaces=false --ignore-scripts --registry=https://registry.npmjs.org
      - name: Prepare verified stock dist
        run: python3 setup.py
      - name: Observe expected stock regression failure
        run: |
          set +e
          node check-loaders.mjs stock > results/loader-red.log 2>&1
          rc=$?
          set -e
          cat results/loader-red.log
          test "$rc" -ne 0
          grep -q 'filter must be normalized once per hook' results/loader-red.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unplugin-filter-u2-red
          path: bench/unplugin-filter/results/
          retention-days: 30
