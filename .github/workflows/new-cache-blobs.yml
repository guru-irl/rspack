name: New Cache Blobs

on:
  push:
    branches: [bench/newcache-blob-checks]

permissions:
  contents: read

jobs:
  crate-tests:
    name: Blob regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install matching Rust toolchain
        run: |
          TOOLCHAIN=$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Set durable scratch for crate tests
        run: |
          mkdir -p "$RUNNER_TEMP/new-cache-blobs/tmp"
          echo "TMPDIR=$RUNNER_TEMP/new-cache-blobs/tmp" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP/new-cache-blobs/tmp" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP/new-cache-blobs/tmp" >> "$GITHUB_ENV"
      - name: Prepare isolated published and patched crates
        run: python scripts/bench/new-cache-blobs/prepare.py
      - name: Confirm regression fails on published 0.1.1
        working-directory: ${{ runner.temp }}/new-cache-blobs/baseline-crate
        run: |
          mkdir -p ../out
          set +e
          cargo test --release --locked commit_deletes_superseded_blob -- --test-threads=1 > ../out/red.log 2>&1
          rc=$?
          set -e
          tail -40 ../out/red.log
          test "$rc" -ne 0
          grep -q 'Commit must retire the old blob' ../out/red.log
      - name: Run all patched crate tests
        working-directory: ${{ runner.temp }}/new-cache-blobs/patched-crate
        run: cargo test --release --locked -- --test-threads=1 2>&1 | tee ../out/green.log
      - name: Build paired synthetic harnesses
        working-directory: ${{ runner.temp }}/new-cache-blobs
        run: |
          cargo build --release --locked --manifest-path baseline/Cargo.toml
          cargo build --release --locked --manifest-path patched/Cargo.toml
      - name: Build native footprint helper
        if: runner.os == 'macOS'
        run: clang -O2 -dynamiclib scripts/bench/new-cache-blobs/memory-macos.c -o "$RUNNER_TEMP/new-cache-blobs/memory-macos.dylib"
      - name: Measure paired scenarios A and B
        run: |
          python -m pip install psutil
          python scripts/bench/new-cache-blobs/measure.py
      - name: Preserve logs and measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: new-cache-blobs-${{ matrix.os }}
          path: ${{ runner.temp }}/new-cache-blobs/out
          if-no-files-found: warn
