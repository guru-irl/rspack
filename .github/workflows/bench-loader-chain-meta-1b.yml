name: Loader Chain Metadata
on:
  push:
    branches: ['bench/loader-chain-meta-1b-measure']
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '4'
      TMPDIR: ${{ github.workspace }}/bench-data/temp
      BASE: 300a8a6a38d1251db2e75d5933676e123eddbdd0
      PR: 9ff2c7b62c30314d99e26813c9d5002f9a53de7a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Scratch directory
        run: |
          set -euo pipefail
          mkdir -p bench-data/temp bench-data/results
          git diff --exit-code "$PR" -- crates/rspack_binding_api/src/plugins/js_loader packages/rspack/src/loader-runner/index.ts
      - uses: ./.github/actions/pnpm/setup
      - uses: ./.github/actions/rustup
        with:
          key: x86_64-unknown-linux-gnu-loader-chain-dev
          save-if: true
      - name: Rust formatting
        run: |
          set -euo pipefail
          cargo fmt --all --check 2>&1 | tee bench-data/results/fmt.log
      - uses: xc2/free-disk-space@fbe203b3788f2bebe2c835a15925da303eaa5efe
        with:
          tool-cache: false
      - name: Install dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
      - name: Reproduce broad module selection on base
        run: |
          set -euo pipefail
          git restore --source="$BASE" -- crates/rspack_binding_api/src/plugins/js_loader/context.rs crates/rspack_binding_api/src/plugins/js_loader/mod.rs crates/rspack_binding_api/src/plugins/js_loader/scheduler.rs packages/rspack/src/loader-runner/index.ts crates/node_binding/napi-binding.d.ts
          touch crates/rspack_binding_api/src/plugins/js_loader/{context,mod,scheduler}.rs
          cargo codegen
          pnpm run build:cli:dev 2>&1 | tee bench-data/results/base-dev-build.log
          git diff --exit-code "$BASE" -- crates/node_binding/napi-binding.d.ts
          set +e
          pnpm --dir tests/rspack-test run test --project base -t module 2>&1 | tee bench-data/results/base-broad-modules.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            echo 'Base passed the broad selection: stop for a possible regression'
            exit 1
          fi
          python3 - <<'PY'
          import pathlib, re
          raw = pathlib.Path('bench-data/results/base-broad-modules.log').read_text()
          text = re.sub(r'\x1b\[[0-9;]*m', '', raw)
          failures = re.findall(r'^\s*FAIL\s+Serial\.test\.mjs\s+>\s+(.*)$', text, re.M)
          assert len(failures) == 2, failures
          assert all('module-federation-with-shareScope' in name for name in failures), failures
          assert any('container/module-federation-with-shareScope' in name for name in failures)
          assert any('container-1-5/module-federation-with-shareScope' in name for name in failures)
          assert 'expected 1 to be 2' in text
          assert re.search(r'Tests\s+2 failed', text)
          print('BASE_SELECTION_FAILURE_REPRODUCED')
          PY
      - name: Build development prototype and JavaScript
        run: |
          set -euo pipefail
          git restore --source="$PR" -- crates/rspack_binding_api/src/plugins/js_loader/context.rs crates/rspack_binding_api/src/plugins/js_loader/mod.rs crates/rspack_binding_api/src/plugins/js_loader/scheduler.rs packages/rspack/src/loader-runner/index.ts crates/node_binding/napi-binding.d.ts
          touch crates/rspack_binding_api/src/plugins/js_loader/{context,mod,scheduler}.rs
          cargo codegen
          pnpm run build:cli:dev 2>&1 | tee bench-data/results/dev-build.log
          git diff --exit-code "$PR" -- crates/node_binding/napi-binding.d.ts
      - name: Existing loader, parallel loader and watch cases
        run: |
          set -euo pipefail
          pnpm --dir tests/rspack-test run test --project base -t loader 2>&1 | tee bench-data/results/loaders.log
      - name: Existing module cases
        run: |
          set -euo pipefail
          pnpm --dir tests/rspack-test run test --project base -t configCases/module 2>&1 | tee bench-data/results/modules.log
      - name: Existing compiler cases
        run: |
          set -euo pipefail
          pnpm --dir tests/rspack-test run test --project base -t compiler 2>&1 | tee bench-data/results/compiler.log
      - name: Touched-crate clippy
        run: |
          set -euo pipefail
          cargo clippy -p rspack_binding_api --all-targets --no-deps --features plugin,test-loader -- --deny warnings 2>&1 | tee bench-data/results/clippy.log
      - name: Unit suites
        run: |
          set -euo pipefail
          timeout 35m pnpm run test:unit 2>&1 | tee bench-data/results/unit.log
          echo CORRECTNESS_PASSED
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: loader-chain-correctness
          path: bench-data/results/
          compression-level: 1
