name: Cold Loader Screens
on:
  workflow_dispatch:
    inputs:
      screen:
        description: Fixed screen to run
        type: choice
        required: true
        default: S1
        options: [S1, S0]
permissions:
  contents: read
concurrency:
  group: cold-loader-screens-${{ github.ref }}
  cancel-in-progress: false
jobs:
  screen:
    name: ${{ inputs.screen }} (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      TMPDIR: ${{ github.workspace }}/bench-data/temp
      TMP: ${{ github.workspace }}/bench-data/temp
      TEMP: ${{ github.workspace }}/bench-data/temp
      NPM_CONFIG_CACHE: ${{ github.workspace }}/bench-data/temp/npm-cache
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/bench-data/temp/npmrc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare writable directories
        run: |
          set -euo pipefail
          mkdir -p bench-data/temp bench-data/results
          printf 'registry=https://registry.npmjs.org\n' > "$NPM_CONFIG_USERCONFIG"
          echo "CLOCK_TICKS=$(getconf CLK_TCK)" >> "$GITHUB_ENV"
          git rev-parse HEAD > bench-data/results/commit.txt
          uname -a > bench-data/results/host.txt
          df -h . >> bench-data/results/host.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Harness preflight
        run: |
          set -euo pipefail
          node --check scripts/program-native/prepare.mjs
          node --check scripts/program-native/run.mjs
          node --check scripts/cold-screen/install.mjs
          node --check scripts/cold-screen/layout.mjs
          node --check scripts/cold-screen/emission.mjs
          node --check scripts/cold-screen/schedule.mjs
          python3 -m py_compile scripts/cold-screen/summary.py scripts/loader-result-readback/exact.py
          python3 -c 'import sys; sys.path.insert(0, "scripts/loader-result-readback"); from exact import paired_location; assert paired_location([0]*10, [1]*10)["exact95"] == [1, 1]; assert paired_location([0]*10, [0]*10)["exact95"] == [0, 0]'
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import {selected, crossingModules} from "./scripts/cold-screen/layout.mjs";
            const files = ["/fixture/entry.js"];
            for (let g = 0; g < 100; g++) {
              files.push(`/fixture/src/g${g}/index.js`);
              for (let m = 0; m < 600; m++) files.push(`/fixture/src/g${g}/m${m}.js`);
            }
            for (let t = 0; t < 600; t++) files.push(`/fixture/typed/t${t}.ts`);
            assert.equal(files.length, 60701);
            for (const cell of ["F25", "F5"]) assert.equal(files.filter(file => selected(cell, file)).length, crossingModules(cell));
            console.log("Native coverage selection passed");'
      - name: Published package install and native identity gate
        run: |
          set -euo pipefail
          node scripts/cold-screen/install.mjs '${{ inputs.screen }}' > bench-data/results/install-console.log 2>&1
      - name: Generate generic fixture
        run: |
          set -euo pipefail
          node scripts/program-native/prepare.mjs bench-data/fixture > bench-data/results/fixture.json
      - name: Diagnostics then fixed fresh-process schedule
        run: |
          set -euo pipefail
          node --expose-gc scripts/cold-screen/schedule.mjs '${{ inputs.screen }}' > bench-data/results/measure-console.log 2>&1
      - name: Summarize
        run: |
          set -euo pipefail
          python3 scripts/cold-screen/summary.py bench-data/results > bench-data/results/summary-console.log
          date -u '+%FT%TZ' > bench-data/results/finished.txt
      - name: Preserve all attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cold-loader-${{ inputs.screen }}-${{ matrix.runner }}-${{ github.run_attempt }}
          retention-days: 30
          compression-level: 1
          path: |
            bench-data/results/
            scripts/cold-screen/
            scripts/program-native/prepare.mjs
            scripts/program-native/run.mjs
            scripts/loader-result-readback/exact.py
