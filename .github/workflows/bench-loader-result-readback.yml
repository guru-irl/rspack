name: single-wake macOS memory follow-up
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: single-wake-mac-followup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  memory:
    name: Memory (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 135
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '3'
      TMPDIR: ${{ github.workspace }}/bench-data/temp
      BASE: d9d09d4152cd15fc46eb5d1cb8d9b227bfcd39eb
      PR: c2b473322d3d6c1292f8a124cdc4206ce52b35e3
      EXPECTED_OS: ${{ matrix.runner == 'macos-15' && 'darwin' || matrix.runner == 'windows-2025' && 'win32' || 'linux' }}
      EXPECTED_ARCH: ${{ matrix.runner == 'macos-15' && 'arm64' || 'x64' }}
      NATIVE_FILE: ${{ matrix.runner == 'macos-15' && 'rspack.darwin-arm64.node' || matrix.runner == 'windows-2025' && 'rspack.win32-x64-msvc.node' || 'rspack.linux-x64-gnu.node' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Scratch directory and binding path
        run: |
          set -euo pipefail
          mkdir -p bench-data/temp bench-data/results bench-data/bindings
          echo "BINDING_PATH=$GITHUB_WORKSPACE/crates/node_binding/$NATIVE_FILE" >> "$GITHUB_ENV"
          if [ "$EXPECTED_OS" = linux ]; then echo "CLOCK_TICKS=$(getconf CLK_TCK)" >> "$GITHUB_ENV"; fi
          git restore --source="$BASE" -- . ':(exclude).github' ':(exclude)scripts/loader-result-readback' ':(exclude)scripts/program-native'
      - uses: ./.github/actions/pnpm/setup
      - name: Install dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          npm install --prefix bench-data/parser --no-package-lock --ignore-scripts acorn@8.15.0 escodegen@2.1.0
      - uses: ./.github/actions/rustup
        with:
          key: ${{ matrix.runner == 'macos-15' && 'aarch64-apple-darwin-ci' || matrix.runner == 'windows-2025' && 'x86_64-pc-windows-msvc-ci' || 'x86_64-unknown-linux-gnu-ci' }}
          save-if: true
      - name: Harness preflight
        run: |
          set -euo pipefail
          node --check scripts/program-native/run.mjs
          node --check scripts/loader-result-readback/pairs.mjs
          python3 -m py_compile scripts/loader-result-readback/summary.py scripts/loader-result-readback/exact.py scripts/loader-result-readback/followup.py
          python3 scripts/loader-result-readback/followup.py --preflight
          python3 -c 'import sys; sys.path.insert(0, "scripts/loader-result-readback"); from exact import paired_location; assert paired_location([0]*10, [1]*10)["exact95"] == [1, 1]; assert paired_location([0]*10, [0]*10)["exact95"] == [0, 0]'
      - name: Environment and source identity
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import fs from "node:fs";
            import os from "node:os";
            import {createHash} from "node:crypto";
            if (process.platform !== process.env.EXPECTED_OS || process.arch !== process.env.EXPECTED_ARCH) throw new Error("Wrong runner architecture");
            const fixtureScripts = Object.fromEntries(["scripts/program-native/prepare.mjs", "scripts/program-native/run.mjs", "scripts/loader-result-readback/pairs.mjs", "scripts/loader-result-readback/exact.py", "scripts/loader-result-readback/summary.py"].map(file => [file, createHash("sha256").update(fs.readFileSync(file)).digest("hex")]));
            const value = {started: new Date().toISOString(), platform: process.platform, arch: process.arch, node: process.version, os: os.version(), release: os.release(), cpus: os.cpus(), ram: os.totalmem(), mimallocEnvironment: Object.fromEntries(Object.entries(process.env).filter(([key]) => key.startsWith("MIMALLOC_"))), image: process.env.ImageOS, imageVersion: process.env.ImageVersion, base: process.env.BASE, pr: process.env.PR, fixtureScripts};
            fs.writeFileSync("bench-data/results/environment.json", JSON.stringify(value, null, 2));
            console.log(JSON.stringify(value, null, 2));'
          { uname -a; rustc -Vv; git rev-parse HEAD; df -h .; } | tee bench-data/results/environment.txt
          git merge-base "$BASE" "$PR" | tee bench-data/results/merge-base.txt
          test "$(git merge-base "$BASE" "$PR")" = "$BASE"
          test "$(git rev-parse origin/perf-js-call-single-wake)" = "$PR"
          printf '%s\n' crates/rspack_binding_api/src/plugins/js_loader/mod.rs crates/rspack_binding_api/src/plugins/js_loader/scheduler.rs crates/rspack_napi/src/threadsafe_function.rs > bench-data/results/expected-source-files.txt
          git diff --name-only "$BASE" "$PR" > bench-data/results/actual-source-files.txt
          diff -u bench-data/results/expected-source-files.txt bench-data/results/actual-source-files.txt
          git diff "$BASE" "$PR" > bench-data/results/source.diff
          if [ "$EXPECTED_OS" != win32 ]; then cargo fmt --all --check; fi
      - name: Build base and JavaScript artifacts
        run: |
          set -euo pipefail
          git restore --source="$BASE" -- . ':(exclude).github' ':(exclude)scripts/loader-result-readback' ':(exclude)scripts/program-native'
          git diff --exit-code "$BASE" -- . ':(exclude).github' ':(exclude)scripts/loader-result-readback' ':(exclude)scripts/program-native'
          cargo codegen
          rm -f "$BINDING_PATH"
          pnpm run build:binding:ci 2>&1 | tee bench-data/results/base-build.log
          grep -F 'Compiling rspack_binding_api' bench-data/results/base-build.log
          grep -F 'Compiling rspack_napi' bench-data/results/base-build.log
          cp "$BINDING_PATH" bench-data/bindings/base.node
          pnpm run build:js 2>&1 | tee bench-data/results/js-build.log
      - name: Build candidate with identical settings
        run: |
          set -euo pipefail
          git restore --source="$PR" -- crates/rspack_binding_api/src/plugins/js_loader/mod.rs crates/rspack_binding_api/src/plugins/js_loader/scheduler.rs crates/rspack_napi/src/threadsafe_function.rs
          git diff --exit-code "$PR" -- . ':(exclude).github' ':(exclude)scripts/loader-result-readback' ':(exclude)scripts/program-native'
          rm -f "$BINDING_PATH"
          pnpm run build:binding:ci 2>&1 | tee bench-data/results/pr-build.log
          grep -F 'Compiling rspack_binding_api' bench-data/results/pr-build.log
          grep -F 'Compiling rspack_napi' bench-data/results/pr-build.log
          cp "$BINDING_PATH" bench-data/bindings/pr.node
          git diff --exit-code "$PR" -- crates/node_binding/napi-binding.d.ts
      - name: Native identity gate before timing
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import fs from "node:fs";
            import {createHash} from "node:crypto";
            const hashes = Object.fromEntries(["base", "pr"].map(arm => [arm, createHash("sha256").update(fs.readFileSync(`bench-data/bindings/${arm}.node`)).digest("hex")]));
            fs.writeFileSync("bench-data/results/build-identities.json", JSON.stringify(hashes, null, 2));
            console.log(hashes);
            if (hashes.base === hashes.pr) throw new Error("Identical arm binaries: refusing timing");'
      - name: Generate unchanged native-study fixture
        run: |
          set -euo pipefail
          node scripts/program-native/prepare.mjs bench-data/fixture
      - name: Phase R, default-environment replication
        run: |
          set -euo pipefail
          mkdir -p bench-data/results/R
          cp bench-data/results/environment.json bench-data/results/build-identities.json bench-data/results/R/
          BENCH_PHASE=R node scripts/loader-result-readback/pairs.mjs 2>&1 | tee bench-data/results/R/pairs.log
          python3 scripts/loader-result-readback/summary.py bench-data/results/R 2>&1 | tee bench-data/results/R/analysis.log
      - name: Phase P, process-only MIMALLOC_PURGE_DELAY=0
        run: |
          set -euo pipefail
          mkdir -p bench-data/results/P
          cp bench-data/results/environment.json bench-data/results/build-identities.json bench-data/results/P/
          BENCH_PHASE=P node scripts/loader-result-readback/pairs.mjs 2>&1 | tee bench-data/results/P/pairs.log
          python3 scripts/loader-result-readback/summary.py bench-data/results/P 2>&1 | tee bench-data/results/P/analysis.log
      - name: Hosted recomputation and report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > bench-data/results/run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" > bench-data/results/jobs.json
          python3 scripts/loader-result-readback/followup.py 2>&1 | tee bench-data/results/verification.log
          cat bench-data/results/followup-report.md >> "$GITHUB_STEP_SUMMARY"
          date -u '+%Y-%m-%dT%H:%M:%SZ' > bench-data/results/finished.txt
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: single-wake-mac-followup-${{ matrix.runner }}
          retention-days: 30
          path: |
            bench-data/results/
            scripts/loader-result-readback/
            scripts/program-native/prepare.mjs
            scripts/program-native/run.mjs
          compression-level: 1
