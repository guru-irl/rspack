name: Source Canary Physical Footprint
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: source-canary-footprint-${{ github.ref }}
  cancel-in-progress: false
jobs:
  measure:
    name: macOS footprint replicate ${{ matrix.replica }}
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      TMPDIR: ${{ github.workspace }}/bench-data/temp
      TMP: ${{ github.workspace }}/bench-data/temp
      TEMP: ${{ github.workspace }}/bench-data/temp
      NPM_CONFIG_CACHE: ${{ github.workspace }}/bench-data/temp/npm-cache
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/bench-data/temp/npmrc
      MEASURE_PHYS_FOOTPRINT: '1'
      MEASUREMENT_DEADLINE: '2026-10-17T21:55:00Z'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare directories and gate runner image
        run: |
          set -euo pipefail
          mkdir -p bench-data/temp bench-data/results
          printf 'registry=https://registry.npmjs.org\n' > "$NPM_CONFIG_USERCONFIG"
          git rev-parse HEAD > bench-data/results/commit.txt
          date -u '+%FT%TZ' > bench-data/results/started.txt
          uname -a > bench-data/results/host.txt
          df -h . >> bench-data/results/host.txt
          printf '%s\n' "$ImageOS" "$ImageVersion" >> bench-data/results/host.txt
          test "$ImageOS" = macos26
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: guru-irl/rspack
          run-id: 39062953727
          artifact-ids: 12113060187,12113636023
          path: source-artifacts
      - name: Harness and headless footprint preflight
        run: |
          set -euo pipefail
          node --check scripts/program-native/run.mjs
          node --check scripts/cold-screen/footprint.mjs
          node --check scripts/cold-screen/source-install.mjs
          node --check scripts/cold-screen/schedule.mjs
          python3 -m py_compile scripts/cold-screen/canary-summary.py scripts/loader-result-readback/exact.py
          python3 -c 'import sys; sys.path.insert(0, "scripts/loader-result-readback"); from exact import paired_location; assert paired_location([0]*8, [1]*8)["exact95"] == [1, 1]; assert paired_location([0]*16, [0]*16)["exact95"] == [0, 0]'
          node scripts/cold-screen/footprint.mjs > bench-data/results/footprint-preflight-console.log 2>&1
      - name: Install retained source arms and generate unchanged fixture
        run: |
          set -euo pipefail
          node scripts/cold-screen/source-install.mjs > bench-data/results/install-console.log 2>&1
          node scripts/program-native/prepare.mjs bench-data/fixture > bench-data/results/fixture.json
      - name: One warmup per arm and eight alternating pairs
        run: |
          set -euo pipefail
          node --expose-gc scripts/cold-screen/schedule.mjs SP > bench-data/results/measure-console.log 2>&1
          python3 scripts/cold-screen/canary-summary.py bench-data/results bench-data/results > bench-data/results/summary-console.log
          date -u '+%FT%TZ' > bench-data/results/finished.txt
      - name: Preserve all attempts and raw probes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canary-footprint-mac-${{ matrix.replica }}
          retention-days: 30
          compression-level: 1
          path: bench-data/results/
  summary:
    name: Pool within-runner paired contrasts
    needs: measure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      TMPDIR: ${{ github.workspace }}/bench-temp
      TMP: ${{ github.workspace }}/bench-temp
      TEMP: ${{ github.workspace }}/bench-temp
      MEASURE_PHYS_FOOTPRINT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare directories
        run: |
          set -euo pipefail
          mkdir -p bench-temp
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: canary-footprint-mac-*
          path: combined
      - name: Exact paired analysis
        run: |
          set -euo pipefail
          python3 scripts/cold-screen/canary-summary.py pooled combined/canary-footprint-mac-1 combined/canary-footprint-mac-2 > pooled-console.log
          date -u '+%FT%TZ' > pooled/finished.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canary-footprint-pooled
          retention-days: 30
          path: pooled/
