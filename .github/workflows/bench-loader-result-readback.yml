name: Loader Chain Metadata Platform Memory
on:
  push:
    branches: ['bench/loader-chain-meta-1b-xplat']
permissions:
  contents: read
  actions: read
concurrency:
  group: loader-chain-meta-1b-xplat
  cancel-in-progress: false
jobs:
  memory:
    name: Memory (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '3'
      TMPDIR: ${{ github.workspace }}/bench-data/temp
      BASE: 300a8a6a38d1251db2e75d5933676e123eddbdd0
      PR: e673cb394d3ddf5e2d39a8554f0c0697ba56b2ef
      UBUNTU_RUN: '39053052058'
      EXPECTED_OS: ${{ matrix.runner == 'macos-15' && 'darwin' || 'win32' }}
      EXPECTED_ARCH: ${{ matrix.runner == 'macos-15' && 'arm64' || 'x64' }}
      NATIVE_FILE: ${{ matrix.runner == 'macos-15' && 'rspack.darwin-arm64.node' || 'rspack.win32-x64-msvc.node' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Scratch directory, source and Ubuntu gate
        run: |
          set -euo pipefail
          mkdir -p bench-data/temp bench-data/results bench-data/bindings bench-data/js
          echo "BINDING_PATH=$GITHUB_WORKSPACE/crates/node_binding/$NATIVE_FILE" >> "$GITHUB_ENV"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UBUNTU_RUN" > bench-data/results/ubuntu-gate.json
          python3 - <<'PY'
          import json
          gate = json.load(open('bench-data/results/ubuntu-gate.json'))
          assert gate['status'] == 'completed' and gate['conclusion'] == 'success'
          PY
          validated=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UBUNTU_RUN" --jq .head_sha)
          git diff --exit-code "$validated" "$PR" -- crates packages Cargo.toml Cargo.lock rust-toolchain.toml pnpm-lock.yaml
          git diff --exit-code "$PR" -- crates packages Cargo.toml Cargo.lock rust-toolchain.toml pnpm-lock.yaml
      - uses: ./.github/actions/pnpm/setup
      - name: Install dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          npm install --prefix bench-data/parser --no-package-lock --ignore-scripts acorn@8.15.0 escodegen@2.1.0
      - uses: ./.github/actions/rustup
        with:
          key: ${{ matrix.runner == 'macos-15' && 'aarch64-apple-darwin-ci' || 'x86_64-pc-windows-msvc-ci' }}
          save-if: true
      - name: Harness preflight
        run: |
          set -euo pipefail
          node --check scripts/program-native/run.mjs
          node --check scripts/loader-result-readback/pairs.mjs
          python3 -m py_compile scripts/loader-result-readback/summary.py scripts/loader-result-readback/exact.py
          python3 -c 'import sys; sys.path.insert(0, "scripts/loader-result-readback"); from exact import paired_location; assert paired_location([0]*10, [1]*10)["exact95"] == [1, 1]; assert paired_location([0]*10, [0]*10)["exact95"] == [0, 0]'
      - name: Environment and source identity
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import fs from "node:fs";
            import os from "node:os";
            import {createHash} from "node:crypto";
            if (process.platform !== process.env.EXPECTED_OS || process.arch !== process.env.EXPECTED_ARCH) throw new Error("Wrong runner architecture");
            const fixtureScripts = Object.fromEntries(["scripts/program-native/prepare.mjs", "scripts/program-native/run.mjs", "scripts/loader-result-readback/pairs.mjs", "scripts/loader-result-readback/exact.py", "scripts/loader-result-readback/summary.py"].map(file => [file, createHash("sha256").update(fs.readFileSync(file)).digest("hex")]));
            const value = {started: new Date().toISOString(), platform: process.platform, arch: process.arch, node: process.version, os: os.version(), release: os.release(), cpus: os.cpus(), ram: os.totalmem(), image: process.env.ImageOS, imageVersion: process.env.ImageVersion, base: process.env.BASE, pr: process.env.PR, fixtureScripts};
            fs.writeFileSync("bench-data/results/environment.json", JSON.stringify(value, null, 2));
            console.log(JSON.stringify(value, null, 2));'
          { uname -a; rustc -Vv; git rev-parse HEAD; df -h .; } | tee bench-data/results/environment.txt
          test "$(git merge-base "$BASE" "$PR")" = "$BASE"
          git diff "$BASE" "$PR" > bench-data/results/source.diff
          if [ "$EXPECTED_OS" != win32 ]; then cargo fmt --all --check; fi
      - name: Build base and matching JavaScript artifacts
        run: |
          set -euo pipefail
          git restore --source="$BASE" -- crates/rspack_binding_api/src/plugins/js_loader/context.rs crates/rspack_binding_api/src/plugins/js_loader/mod.rs crates/rspack_binding_api/src/plugins/js_loader/scheduler.rs packages/rspack/src/loader-runner/index.ts crates/node_binding/napi-binding.d.ts
          touch crates/rspack_binding_api/src/plugins/js_loader/{context,mod,scheduler}.rs
          git diff --exit-code "$BASE" -- crates packages Cargo.toml Cargo.lock rust-toolchain.toml pnpm-lock.yaml
          cargo codegen
          rm -f "$BINDING_PATH"
          pnpm run build:binding:ci 2>&1 | tee bench-data/results/base-build.log
          grep -F 'Compiling rspack_binding_api' bench-data/results/base-build.log
          cp "$BINDING_PATH" bench-data/bindings/base.node
          pnpm run build:js 2>&1 | tee bench-data/results/base-js-build.log
          cp -a packages/rspack/dist bench-data/js/base
          git diff --exit-code "$BASE" -- crates/node_binding/napi-binding.d.ts
      - name: Build candidate with identical settings and matching JavaScript
        run: |
          set -euo pipefail
          git restore --source="$PR" -- crates/rspack_binding_api/src/plugins/js_loader/context.rs crates/rspack_binding_api/src/plugins/js_loader/mod.rs crates/rspack_binding_api/src/plugins/js_loader/scheduler.rs packages/rspack/src/loader-runner/index.ts crates/node_binding/napi-binding.d.ts
          touch crates/rspack_binding_api/src/plugins/js_loader/{context,mod,scheduler}.rs
          git diff --exit-code "$PR" -- crates packages Cargo.toml Cargo.lock rust-toolchain.toml pnpm-lock.yaml
          cargo codegen
          rm -f "$BINDING_PATH"
          pnpm run build:binding:ci 2>&1 | tee bench-data/results/pr-build.log
          grep -F 'Compiling rspack_binding_api' bench-data/results/pr-build.log
          cp "$BINDING_PATH" bench-data/bindings/pr.node
          pnpm run build:js 2>&1 | tee bench-data/results/pr-js-build.log
          cp -a packages/rspack/dist bench-data/js/pr
          git diff --exit-code "$PR" -- crates/node_binding/napi-binding.d.ts
      - name: Native identity gate before timing
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import fs from "node:fs";
            import {createHash} from "node:crypto";
            const hashes = Object.fromEntries(["base", "pr"].map(arm => [arm, createHash("sha256").update(fs.readFileSync(`bench-data/bindings/${arm}.node`)).digest("hex")]));
            fs.writeFileSync("bench-data/results/build-identities.json", JSON.stringify(hashes, null, 2));
            console.log(hashes);
            if (hashes.base === hashes.pr) throw new Error("Identical arm binaries: refusing timing");'
      - name: Generate both fixture parameters
        run: |
          set -euo pipefail
          node scripts/program-native/prepare.mjs bench-data/fixture-1 1
          node scripts/program-native/prepare.mjs bench-data/fixture-5 5
      - name: Fixed fresh-process protocol for both fixtures
        run: |
          set -euo pipefail
          for count in 1 5; do
            root="bench-data/results/loaders-$count"
            mkdir -p "$root"
            cp bench-data/results/build-identities.json "$root/"
            COUNT="$count" ROOT="$root" node --input-type=module -e 'import fs from "node:fs"; const value = JSON.parse(fs.readFileSync("bench-data/results/environment.json")); value.noopLoaders = Number(process.env.COUNT); fs.writeFileSync(`${process.env.ROOT}/environment.json`, JSON.stringify(value, null, 2));'
            FIXTURE_ROOT="bench-data/fixture-$count" RESULTS_ROOT="$root" node scripts/loader-result-readback/pairs.mjs 2>&1 | tee "$root/pairs.log"
            python3 scripts/loader-result-readback/summary.py "$root" > "$root/analysis.log"
          done
          python3 scripts/loader-result-readback/readable.py | tee bench-data/results/readable.md
          cat bench-data/results/readable.md >> "$GITHUB_STEP_SUMMARY"
          date -u '+%Y-%m-%dT%H:%M:%SZ' > bench-data/results/finished.txt
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: loader-chain-metadata-${{ matrix.runner }}
          retention-days: 30
          path: |
            bench-data/results/
            scripts/loader-result-readback/
            scripts/program-native/prepare.mjs
            scripts/program-native/run.mjs
          compression-level: 1
