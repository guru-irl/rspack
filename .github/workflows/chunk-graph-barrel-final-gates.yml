name: Chunk graph barrel final gates
on:
  push:
    branches: ['bench/chunk-graph-barrel-final-gates']
  workflow_dispatch:
    inputs:
      fix_sha:
        description: Candidate implementation commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      CARGO_BUILD_JOBS: 4
      CARGO_PROFILE_DEV_DEBUG: 0
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/pnpm/setup
        with:
          node-version: 24
      - name: Preserve public bench scripts and install candidate
        run: |
          set -euo pipefail
          mkdir -p .spider/scratch/chunk-graph-barrel/{tmp,bench,validation}
          cp scripts/bench/chunk-graph-barrel/* .spider/scratch/chunk-graph-barrel/bench/
          git checkout '${{ inputs.fix_sha || github.sha }}'
          echo "TMPDIR=$PWD/.spider/scratch/chunk-graph-barrel/tmp" >> "$GITHUB_ENV"
          echo "RSPACK_CORE_PATH=$PWD/packages/rspack/dist/index.js" >> "$GITHUB_ENV"
          git rev-parse HEAD > .spider/scratch/chunk-graph-barrel/validation/source.txt
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/rustup
        with:
          key: chunk-graph-barrel-dev
          use-cache: true
          save-if: true
      - name: Build dev binding and JavaScript
        run: |
          set -euo pipefail
          cargo codegen
          pnpm run build:binding:dev 2>&1 | tee .spider/scratch/chunk-graph-barrel/validation/build.log
          pnpm run build:js
      - name: Format check
        if: success() || failure()
        run: |
          set -o pipefail
          cargo fmt --all --check 2>&1 | tee .spider/scratch/chunk-graph-barrel/validation/fmt.log
      - name: Clippy warnings denied
        if: success() || failure()
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --tests --locked -- -D warnings 2>&1 | tee .spider/scratch/chunk-graph-barrel/validation/clippy.log
      - name: Chunk graph watch cases
        if: success() || failure()
        run: |
          set -o pipefail
          pnpm --dir tests/rspack-test run test:base -t 'watchCases/build-chunk-graph/' 2>&1 | tee .spider/scratch/chunk-graph-barrel/validation/chunk-graph.log
      - name: Incremental watch cases
        if: success() || failure()
        run: |
          set -o pipefail
          pnpm --dir tests/rspack-test run test:base -t 'incremental watch' 2>&1 | tee .spider/scratch/chunk-graph-barrel/validation/incremental-watch.log
      - name: Full base integration suite
        if: success() || failure()
        run: |
          set -o pipefail
          pnpm --dir tests/rspack-test run test:base 2>&1 | tee .spider/scratch/chunk-graph-barrel/validation/base.log
      - name: Typecheck test configurations
        if: success() || failure()
        run: |
          set -o pipefail
          pnpm --dir tests/rspack-test run test:configs 2>&1 | tee .spider/scratch/chunk-graph-barrel/validation/configs.log
      - name: Topology changing controls
        if: success() || failure()
        run: |
          set -euo pipefail
          VARIANT=fix FIXTURE_ROOT="$PWD/.spider/scratch/chunk-graph-barrel/controls" RESULT_FILE="$PWD/.spider/scratch/chunk-graph-barrel/validation/controls.json" node .spider/scratch/chunk-graph-barrel/bench/controls.mjs 2>&1 | tee .spider/scratch/chunk-graph-barrel/validation/controls.log
      - name: Explicit unchanged resolver output parity
        run: |
          set -euo pipefail
          cp crates/node_binding/rspack.linux-x64-gnu.node .spider/scratch/chunk-graph-barrel/fix.node
          VARIANT=fix NAPI_RS_NATIVE_LIBRARY_PATH="$PWD/.spider/scratch/chunk-graph-barrel/fix.node" FIXTURE_ROOT="$PWD/.spider/scratch/chunk-graph-barrel/explicit" RESULT_FILE="$PWD/.spider/scratch/chunk-graph-barrel/validation/explicit-fix.json" node .spider/scratch/chunk-graph-barrel/bench/explicit-probe.mjs
          git show f2903b6482:crates/rspack_core/src/compilation/build_chunk_graph/code_splitter.rs > crates/rspack_core/src/compilation/build_chunk_graph/code_splitter.rs
          pnpm run build:binding:dev
          VARIANT=main FIXTURE_ROOT="$PWD/.spider/scratch/chunk-graph-barrel/explicit" RESULT_FILE="$PWD/.spider/scratch/chunk-graph-barrel/validation/explicit-main.json" node .spider/scratch/chunk-graph-barrel/bench/explicit-probe.mjs
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          r=Path('.spider/scratch/chunk-graph-barrel/validation')
          a=json.loads((r/'explicit-main.json').read_text()); b=json.loads((r/'explicit-fix.json').read_text())
          assert [(x['label'],x['outputs']) for x in a] == [(x['label'],x['outputs']) for x in b]
          print('Explicit resolver cold/edit/revert byte parity passes')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: barrel-validation
          path: .spider/scratch/chunk-graph-barrel/validation
          if-no-files-found: error
