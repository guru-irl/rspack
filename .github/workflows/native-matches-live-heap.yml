name: Native matches macOS live heap diagnostic
on:
  push:
    branches: [bench/split-chunks-native-matches-live-heap]
permissions:
  contents: read
  actions: read
concurrency:
  group: native-matches-live-heap
  cancel-in-progress: false
jobs:
  paired-diagnostic:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - name: Reuse matched counter builds and run callback triples
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash scripts/native-matches-bench/macos.sh
      - name: Upload synthetic records and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-matches-live-heap-macos-arm64
          path: .bench-native-matches-live-heap/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
