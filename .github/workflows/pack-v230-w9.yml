name: v2.3.0 native watcher W9 pack
on:
  push:
    branches: [bench/v230-native-watcher-w9]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_INCREMENTAL: 0
  npm_config_registry: https://registry.npmjs.org
  VERSION: 2.3.0
  SOURCE: f31547f0a2bb5fc3a1ff304e5f7f050156092997
  BASE: ca0d75f5444f182acd571968395a3ac1aaff894c
jobs:
  release:
    name: Release binding and matching core
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 40
          persist-credentials: false
      - name: Record exact source
        run: |
          set -euo pipefail
          mkdir -p bench-data/tmp bench-data/results bench-data/pack
          echo "TMPDIR=$GITHUB_WORKSPACE/bench-data/tmp" >> "$GITHUB_ENV"
          git rev-parse HEAD | tee bench-data/results/source.sha
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git merge-base --is-ancestor "$BASE" HEAD
          git diff "$BASE" HEAD > bench-data/results/source.patch
          git diff --stat "$BASE" HEAD > bench-data/results/source-stat.txt
          test ! -d target
      - uses: ./.github/actions/pnpm/setup
      - name: Install dependencies
        run: pnpm install --frozen-lockfile > bench-data/results/install.log 2>&1 || { tail -80 bench-data/results/install.log; exit 1; }
      - uses: ./.github/actions/rustup
        with:
          key: v230-native-watcher-w9-release
          use-cache: false
      - uses: xc2/free-disk-space@fbe203b3788f2bebe2c835a15925da303eaa5efe
        with:
          tool-cache: false
      - name: Prepare release-style build
        run: |
          set -euo pipefail
          command -v clang || { sudo apt-get update; sudo apt-get install -y clang; }
          rustup target add x86_64-unknown-linux-gnu
          cargo codegen 2>&1 | tee bench-data/results/codegen.log
          printf '\ntrim-paths = true\n' >> .cargo/config.toml
          { date -u; node --version; pnpm --version; rustc -Vv; clang --version; gcc --version; ldd --version; df -h .; } > bench-data/results/environment.txt
          test -z "${RUSTFLAGS:-}${CARGO_ENCODED_RUSTFLAGS:-}${SFTRACE:-}${TRACY:-}${DISABLE_PLUGIN:-}"
      - name: Build release binding from scratch
        env:
          RUST_TARGET: x86_64-unknown-linux-gnu
          USE_NAPI_CROSS: 1
          TARGET_CC: clang
        run: |
          set -euo pipefail
          start=$(date +%s)
          pnpm run build:binding:release 2>&1 | tee bench-data/results/native-build.log
          echo "$(( $(date +%s) - start ))" > bench-data/results/build-seconds.txt
          grep -E 'Compiling (rspack_napi|rspack_binding_api|rspack_core) ' bench-data/results/native-build.log > bench-data/results/recompiled-crates.txt
          test "$(wc -l < bench-data/results/recompiled-crates.txt)" -ge 3
          grep -F -- '-Zbuild-std=panic_abort,std' bench-data/results/native-build.log > /dev/null
          grep -oE -- '--features [a-z0-9,-]+' bench-data/results/native-build.log | head -1 > bench-data/results/features.txt
          grep -qx -- '--features plugin,info-level' bench-data/results/features.txt
          cp crates/node_binding/rspack.linux-x64-gnu.node bench-data/pack/
      - name: Build and pack matching core
        run: |
          set -euo pipefail
          pnpm run build:js > bench-data/results/build-js.log 2>&1 || { tail -80 bench-data/results/build-js.log; exit 1; }
          node -e 'const p=require("./packages/rspack/package.json"); if(p.name!=="@rspack/core"||p.version!==process.env.VERSION)throw Error("Wrong core identity")'
          (cd packages/rspack; npm pack --ignore-scripts --pack-destination ../../bench-data/pack)
          sha256sum packages/rspack/dist/index.js > bench-data/results/core-dist.sha256
      - name: Package platform binding and retain official comparison packages
        run: |
          set -euo pipefail
          mkdir -p bench-data/official bench-data/staging bench-data/unpacked
          for p in @rspack/core @rspack/binding @rspack/binding-linux-x64-gnu; do
            (cd bench-data/official; npm pack "$p@$VERSION" --json > "$(echo "$p" | tr -d '@' | tr '/' '-').json")
          done
          (cd bench-data/official; sha256sum *.tgz > SHA256SUMS)
          tar -xzf "bench-data/official/rspack-binding-linux-x64-gnu-$VERSION.tgz" -C bench-data/staging
          cp bench-data/pack/rspack.linux-x64-gnu.node bench-data/staging/package/
          (cd bench-data/staging/package; npm pack --ignore-scripts --pack-destination ../../pack)
          tar -xzf "bench-data/pack/rspack-binding-linux-x64-gnu-$VERSION.tgz" -C bench-data/unpacked
          cmp bench-data/pack/rspack.linux-x64-gnu.node bench-data/unpacked/package/rspack.linux-x64-gnu.node
          official=$(tar -tzf "bench-data/official/rspack-binding-linux-x64-gnu-$VERSION.tgz" | grep '\.node$')
          tar -xOf "bench-data/official/rspack-binding-linux-x64-gnu-$VERSION.tgz" "$official" > bench-data/official/official.node
          og=$(readelf --version-info bench-data/official/official.node | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -1)
          ng=$(readelf --version-info bench-data/pack/rspack.linux-x64-gnu.node | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -1)
          printf 'official=%s\nbuilt=%s\n' "$og" "$ng" > bench-data/results/glibc.txt
          test "$(printf '%s\n' "$og" "$ng" | sort -V | tail -1)" = "$og"
          (cd bench-data/pack; sha256sum *.node *.tgz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: v230-w9-release
          path: bench-data/pack/
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: v230-w9-official
          path: bench-data/official/
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v230-w9-release-evidence
          path: bench-data/results/
          compression-level: 1
          if-no-files-found: error
  development:
    name: Development binding and gates
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 40
          persist-credentials: false
      - uses: ./.github/actions/pnpm/setup
      - uses: ./.github/actions/rustup
        with:
          key: v230-native-watcher-w9-dev
          use-cache: false
      - uses: xc2/free-disk-space@fbe203b3788f2bebe2c835a15925da303eaa5efe
        with:
          tool-cache: false
      - name: Build development artifacts
        run: |
          set -euo pipefail
          mkdir -p bench-data/results bench-data/pack bench-data/tmp
          echo "TMPDIR=$GITHUB_WORKSPACE/bench-data/tmp" >> "$GITHUB_ENV"
          pnpm install --frozen-lockfile > bench-data/results/install.log 2>&1 || { tail -80 bench-data/results/install.log; exit 1; }
          pnpm run build:cli:dev > bench-data/results/build.log 2>&1 || { tail -100 bench-data/results/build.log; exit 1; }
          grep 'Compiling rspack_watcher' bench-data/results/build.log
          cp crates/node_binding/rspack.linux-x64-gnu.node bench-data/pack/
          (cd packages/rspack; npm pack --ignore-scripts --pack-destination ../../bench-data/pack)
          (cd bench-data/pack; sha256sum *.node *.tgz > SHA256SUMS)
          git rev-parse HEAD > bench-data/results/source.sha
      - uses: actions/upload-artifact@v4
        with:
          name: v230-w9-development
          path: bench-data/pack/
          compression-level: 0
          if-no-files-found: error
      - name: Rust watcher gates
        run: |
          set -euo pipefail
          git diff --name-only "$BASE" HEAD -- '*.rs' | xargs rustfmt --check --edition 2024 > bench-data/results/rustfmt.log 2>&1
          cargo test -p rspack_watcher > bench-data/results/rust-tests.log 2>&1 || { tail -100 bench-data/results/rust-tests.log; exit 1; }
          grep 'test result:' bench-data/results/rust-tests.log
          cargo clippy -p rspack_watcher -p rspack_binding_api --all-targets -- -D warnings > bench-data/results/clippy.log 2>&1 || { tail -100 bench-data/results/clippy.log; exit 1; }
      - name: Native watcher compiler cases
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          pnpm --dir tests/rspack-test run test Compiler.test.mjs -t native-watcher- 2>&1 | tee bench-data/results/compiler.log
          grep -E 'Tests[[:space:]]+[1-9][0-9]* passed' bench-data/results/compiler.log
      - name: Watch cases with native watcher disabled
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          pnpm --dir tests/rspack-test run test Watch.part1.test.mjs Watch.part2.test.mjs Watch.part3.test.mjs 2>&1 | tee bench-data/results/watch-off.log
          grep -E 'Tests[[:space:]]+[1-9][0-9]* passed' bench-data/results/watch-off.log
      - name: Watch cases with native watcher enabled
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          pnpm --dir tests/rspack-test run test NativeWatcher.part1.test.mjs NativeWatcher.part2.test.mjs NativeWatcher.part3.test.mjs 2>&1 | tee bench-data/results/watch-on.log
          grep -E 'Tests[[:space:]]+[1-9][0-9]* passed' bench-data/results/watch-on.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v230-w9-development-evidence
          path: bench-data/results/
          compression-level: 1
          if-no-files-found: error
