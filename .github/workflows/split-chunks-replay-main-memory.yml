name: SplitChunks type and layer precompute

on:
  push:
    branches:
      - bench/split-chunks-type-layer-fix-win

permissions:
  contents: read
  actions: read

jobs:
  build-fix:
    name: Build fix ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: '"ubuntu-22.04"'
            target: x86_64-unknown-linux-gnu
          - runner: '"macos-latest"'
            target: aarch64-apple-darwin
          - runner: '"windows-2025"'
            target: x86_64-pc-windows-msvc
    uses: ./.github/workflows/reusable-build-build.yml
    with:
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
      profile: ci
      ref: 7a15687de82662082b0f864d73a476d4fd8734ae

  measure:
    name: Measure ${{ matrix.target }}
    needs: build-fix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x64
            binding: rspack.linux-x64-gnu.node
            pairs: 4
          - runner: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
            binding: rspack.darwin-arm64.node
            pairs: 8
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            arch: x64
            binding: rspack.win32-x64-msvc.node
            pairs: 4
    defaults:
      run:
        shell: bash
    env:
      PARENT_HEAD: cc2f2fa5cf1b910b7e0aaf379aba834e935c32c8
      PR_HEAD: 8190b0aaa7dc93f5d859c305e5d3b5fe4fa53c31
      FIX_HEAD: 7a15687de82662082b0f864d73a476d4fd8734ae
      PARENT_RUN: '40283359653'
      PR_RUN: '40284286679'
      EXPECTED_ARCH: ${{ matrix.arch }}
      PROCESS_PAIRS: ${{ matrix.pairs }}
    steps:
      - name: Checkout benchmark
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare scratch
        run: |
          set -euo pipefail
          mkdir -p bench-data/tmp bench-data/results
          printf 'TMPDIR=%s/bench-data/tmp\nTMP=%s/bench-data/tmp\nTEMP=%s/bench-data/tmp\n' "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/pnpm/setup
        with:
          node-version: 22.23.4

      - name: Record source runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN" > bench-data/parent-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR_RUN" > bench-data/pr-run.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const parent = JSON.parse(fs.readFileSync('bench-data/parent-run.json'));
          const pr = JSON.parse(fs.readFileSync('bench-data/pr-run.json'));
          assert.equal(parent.head_sha, process.env.PARENT_HEAD);
          assert.equal(pr.head_sha, process.env.PR_HEAD);
          const git = args => execFileSync('git', args, { encoding: 'utf8' }).trim();
          assert.equal(git(['rev-parse', process.env.FIX_HEAD + '^']), process.env.PR_HEAD);
          fs.writeFileSync('bench-data/provenance.json', JSON.stringify({ parent: parent.head_sha, pr: pr.head_sha, fix: process.env.FIX_HEAD, benchmark: git(['rev-parse', 'HEAD']), parentRun: parent.id, prRun: pr.id, fixRun: process.env.GITHUB_RUN_ID, frontend: '@rspack-canary/core@2.3.0-canary-162dd637-20261023172544', node: process.version, arch: process.arch }, null, 2));
          NODE

      - name: Download parent binding
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: bindings-${{ matrix.target }}
          path: bench-data/parent-binding
          run-id: ${{ env.PARENT_RUN }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Download PR binding
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: bindings-${{ matrix.target }}
          path: bench-data/pr-binding
          run-id: ${{ env.PR_RUN }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Download fix binding
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: bindings-${{ matrix.target }}
          path: bench-data/fix-binding

      - name: Pin native checksums
        env:
          BINDING_FILE: ${{ matrix.binding }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { hash } from './.github/scripts/type-layer-precompute/native.mjs';
          const bindings = Object.fromEntries(['parent', 'pr', 'fix'].map(version => {
            const file = path.resolve('bench-data', version + '-binding', process.env.BINDING_FILE);
            return [version, { path: fs.realpathSync(file), sha256: hash(file) }];
          }));
          fs.writeFileSync('bench-data/bindings.json', JSON.stringify(bindings, null, 2));
          NODE

      - name: Install fixed frontend
        run: |
          set -euo pipefail
          npm install --prefix bench-data --registry=https://registry.npmjs.org --ignore-scripts --legacy-peer-deps --save-exact --no-audit --no-fund @rspack-canary/core@2.3.0-canary-162dd637-20261023172544 > bench-data/frontend-install.log 2>&1
          cp .github/scripts/type-layer-precompute/{repro,native}.mjs bench-data/

      - name: Prepare fixture and check comparator
        env:
          RSPACK_BINDING: ${{ github.workspace }}/bench-data/parent-binding/${{ matrix.binding }}
        run: |
          set -euo pipefail
          node .github/scripts/type-layer-precompute/native-test.mjs
          node bench-data/repro.mjs setup > bench-data/fixture.log
          node .github/scripts/type-layer-precompute/compare.mjs --self-test

      - name: Run alternating process pairs
        run: |
          set -euo pipefail
          node .github/scripts/type-layer-precompute/compare.mjs > bench-data/results/driver.log 2>&1

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: type-layer-precompute-${{ matrix.target }}
          path: |
            bench-data/results/
            bench-data/provenance.json
            bench-data/bindings.json
            bench-data/frontend-install.log
            bench-data/fixture.log
          if-no-files-found: error
          retention-days: 7
