name: PR59 raise inspect macOS retry receipts
on:
  push:
    branches: [bench/pr59-raise-receipts]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pr59-raise-counted-macOS-head
          run-id: 42602054940
          github-token: ${{ github.token }}
          path: receipts
      - name: Print exact first-attempt failures and second-attempt receipt
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("node:fs"),assert=require("node:assert/strict"); const rows=fs.readFileSync("receipts/gates/compiler-native-1.events.txt","utf8").split("\n"),failed=rows.filter(l=>l.includes(" | TEST_END | ")&&l.includes(" | fail | ")); assert.equal(failed.length,2); console.log("FIRST_ATTEMPT_FAILURES\n"+failed.join("\n")); const log=fs.readFileSync("receipts/gates/compiler-native-1.log.plain","utf8"); console.log(log.split("\n").filter(l=>/FAIL |Error: Case|AssertionError/.test(l)).join("\n")); const receipts=fs.readFileSync("receipts/gates/gates.jsonl","utf8").trim().split("\n").map(JSON.parse); assert.equal(receipts[1].passed,49); assert(receipts[1].ok); console.log("RETRY_RECEIPT",JSON.stringify(receipts[1]));'
