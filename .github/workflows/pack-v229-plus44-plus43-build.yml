name: wake pack on 2.2.8 (rebuilt control, single wake, batched v2)
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_INCREMENTAL: 0
  npm_config_registry: https://registry.npmjs.org
jobs:
  build:
    name: Build ${{ matrix.arm }}
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: W0
            source: a6e6347cb6335b637e6bb03ceafc12a75581b745
          - arm: W46
            source: 468d7d365cc9b45112f3ce6b9dcd7921ea0827d2
          - arm: WB2
            source: 2612dec986801265f3f6be3a4d04a09b8030ba91
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact source and release settings
        run: |
          set -euo pipefail
          mkdir -p bench-data/tmp bench-data/results bench-data/pack
          echo "TMPDIR=$GITHUB_WORKSPACE/bench-data/tmp" >> "$GITHUB_ENV"
          printf '%s\n' "$ImageOS" "$ImageVersion" > bench-data/results/runner-image.txt
          date -u +%FT%TZ > bench-data/results/start-utc.txt
          git rev-parse HEAD | tee bench-data/results/source.sha
          test "$(git rev-parse HEAD)" = '${{ matrix.source }}'
          for file in .github/workflows/reusable-release-npm.yml .github/workflows/reusable-build.yml .github/workflows/reusable-build-build.yml rust-toolchain.toml crates/node_binding/scripts/build.mjs Cargo.toml .cargo/config.toml; do
            mkdir -p "bench-data/results/settings/$(dirname "$file")"
            cp "$file" "bench-data/results/settings/$file"
            git diff --exit-code a6e6347cb6335b637e6bb03ceafc12a75581b745 HEAD -- "$file"
          done
          test ! -d target
      - uses: ./.github/actions/pnpm/setup
        with:
          node-version: 22.18.0
      - name: Install binding dependencies
        run: |
          set -euo pipefail
          pnpm --filter @rspack/binding install --frozen-lockfile 2>&1 | tee bench-data/results/install.log
      - uses: ./.github/actions/rustup
        with:
          key: wake-release-228
          use-cache: false
      - uses: xc2/free-disk-space@fbe203b3788f2bebe2c835a15925da303eaa5efe
        with:
          tool-cache: false
      - name: Prepare official release build
        run: |
          set -euo pipefail
          command -v clang
          rustup target add x86_64-unknown-linux-gnu
          cargo codegen 2>&1 | tee bench-data/results/codegen.log
          printf '\ntrim-paths = true\n' >> .cargo/config.toml
          { date -u; node --version; pnpm --version; rustc -Vv; clang --version; ldd --version; df -h .; } > bench-data/results/environment.txt
          test -z "${RUSTFLAGS:-}${CARGO_ENCODED_RUSTFLAGS:-}"
          test -z "${ALLOCATIVE:-}${SFTRACE:-}${TRACY:-}${DISABLE_PLUGIN:-}"
      - name: Build release binding from scratch
        env:
          RUST_TARGET: x86_64-unknown-linux-gnu
          USE_NAPI_CROSS: 1
          TARGET_CC: clang
        run: |
          set -euo pipefail
          start=$(date +%s)
          date -u +%FT%TZ > bench-data/results/build-start-utc.txt
          pnpm run build:binding:release 2>&1 | tee bench-data/results/native-build.log
          echo "$(( $(date +%s) - start ))" > bench-data/results/build-seconds.txt
          date -u +%FT%TZ > bench-data/results/build-end-utc.txt
          grep -E 'Compiling (rspack_napi|rspack_binding_api) ' bench-data/results/native-build.log | tee bench-data/results/recompiled-crates.txt
          test "$(wc -l < bench-data/results/recompiled-crates.txt)" -eq 2
          grep -F -- '--no-default-features --no-dts-cache --features plugin,info-level' bench-data/results/native-build.log
          grep -F -- '-Zbuild-std=panic_abort,std' bench-data/results/native-build.log
          cp crates/node_binding/rspack.linux-x64-gnu.node bench-data/pack/
      - name: Package exact 2.2.8 identity and check glibc
        run: |
          set -euo pipefail
          mkdir -p bench-data/official bench-data/package bench-data/unpacked
          (cd bench-data/official; npm pack @rspack/binding-linux-x64-gnu@2.2.8)
          echo '3ed0980de069d57787dcf635f1cef20c5d9be3d2dbd6a7d6576f48f06a6221d8  bench-data/official/rspack-binding-linux-x64-gnu-2.2.8.tgz' | sha256sum -c -
          tar -xzf bench-data/official/rspack-binding-linux-x64-gnu-2.2.8.tgz -C bench-data/official
          cp -a bench-data/official/package bench-data/package/
          cp bench-data/pack/rspack.linux-x64-gnu.node bench-data/package/package/
          node -e 'const p=require("./bench-data/package/package/package.json"); if(p.name!=="@rspack/binding-linux-x64-gnu"||p.version!=="2.2.8")throw Error("Wrong package identity")'
          (cd bench-data/package/package; npm pack --pack-destination ../../pack)
          tar -xzf bench-data/pack/rspack-binding-linux-x64-gnu-2.2.8.tgz -C bench-data/unpacked
          cmp bench-data/pack/rspack.linux-x64-gnu.node bench-data/unpacked/package/rspack.linux-x64-gnu.node
          sha256sum bench-data/pack/* > bench-data/results/pack.sha256
          readelf --version-info bench-data/official/package/rspack.linux-x64-gnu.node > bench-data/results/official-readelf.txt
          readelf --version-info bench-data/pack/rspack.linux-x64-gnu.node > bench-data/results/built-readelf.txt
          official=$(grep -oE 'GLIBC_[0-9]+\.[0-9]+' bench-data/results/official-readelf.txt | sort -Vu | tail -1)
          built=$(grep -oE 'GLIBC_[0-9]+\.[0-9]+' bench-data/results/built-readelf.txt | sort -Vu | tail -1)
          printf 'official=%s\nbuilt=%s\n' "$official" "$built" | tee bench-data/results/glibc.txt
          test "$(printf '%s\n' "$official" "$built" | sort -V | tail -1)" = "$official"
      - uses: actions/upload-artifact@v4
        with:
          name: wake-${{ matrix.arm }}-binding
          path: bench-data/pack/
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wake-${{ matrix.arm }}-evidence
          path: bench-data/results/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 1
  verify:
    name: Verify all four bindings
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - uses: actions/download-artifact@v4
        with:
          pattern: wake-*-binding
          path: bench-data/bindings
      - uses: actions/download-artifact@v4
        with:
          pattern: wake-*-evidence
          path: bench-data/build-evidence
      - name: Prepare official runtime and generic fixture
        run: |
          set -euo pipefail
          mkdir -p bench-data/tmp bench-data/results bench-data/scripts bench-data/runtime bench-data/official
          export TMPDIR="$GITHUB_WORKSPACE/bench-data/tmp"
          echo "TMPDIR=$TMPDIR" >> "$GITHUB_ENV"
          printf '%s\n' "$ImageOS" "$ImageVersion" > bench-data/results/runner-image.txt
          for arm in W0 W46 WB2; do
            cmp bench-data/results/runner-image.txt "bench-data/build-evidence/wake-$arm-evidence/runner-image.txt"
          done
          (cd bench-data/official; npm pack @rspack/core@2.2.8; npm pack @rspack/binding@2.2.8; npm pack @rspack/binding-linux-x64-gnu@2.2.8)
          cat > bench-data/results/official-tarballs.sha256 <<'SUMS'
          d4e4d95245daa215f07ca7c37faa1c62e45c7a453e3e845aad3250160c241702  bench-data/official/rspack-core-2.2.8.tgz
          a53c8675985b397cb86898352f08067a5716488c7bb1122d37ef18bd6c5049d3  bench-data/official/rspack-binding-2.2.8.tgz
          3ed0980de069d57787dcf635f1cef20c5d9be3d2dbd6a7d6576f48f06a6221d8  bench-data/official/rspack-binding-linux-x64-gnu-2.2.8.tgz
          SUMS
          sha256sum -c bench-data/results/official-tarballs.sha256
          printf '{"private":true}\n' > bench-data/runtime/package.json
          npm install --prefix bench-data/runtime --ignore-scripts --no-audit --no-fund @rspack/core@2.2.8 acorn escodegen
          tar -xzf bench-data/official/rspack-core-2.2.8.tgz -C bench-data/runtime/node_modules/@rspack/core --strip-components=1
          tar -xzf bench-data/official/rspack-binding-2.2.8.tgz -C bench-data/runtime/node_modules/@rspack/binding --strip-components=1
          tar -xzf bench-data/official/rspack-binding-linux-x64-gnu-2.2.8.tgz -C bench-data/official
          cp bench-data/official/package/rspack.linux-x64-gnu.node bench-data/official.node
          for arm in W0 W46 WB2; do
            cp "bench-data/bindings/wake-$arm-binding/rspack.linux-x64-gnu.node" "bench-data/$arm.node"
          done
          sha256sum bench-data/official.node bench-data/W0.node bench-data/W46.node bench-data/WB2.node | tee bench-data/results/native-identities.sha256
          test "$(cut -d' ' -f1 bench-data/results/native-identities.sha256 | sort -u | wc -l)" -eq 4
          cp .github/scripts/wake-3arm/* bench-data/scripts/
          node bench-data/scripts/prepare.mjs bench-data/fixture | tee bench-data/results/fixture.json
          python3 bench-data/scripts/compare.py --self-test
      - name: Output parity on 60701 modules
        run: |
          set -euo pipefail
          for arm in official W0 W46 WB2; do
            native="$GITHUB_WORKSPACE/bench-data/$arm.node"
            rm -rf bench-data/fixture/out
            NAPI_RS_NATIVE_LIBRARY_PATH="$native" EXPECTED_NATIVE_SHA="$(sha256sum "$native" | cut -d' ' -f1)" MAPS_FILE="$GITHUB_WORKSPACE/bench-data/results/$arm.maps" IDENTITY_FILE="$GITHUB_WORKSPACE/bench-data/results/$arm.identity.json" node --require "$GITHUB_WORKSPACE/bench-data/scripts/identity.cjs" bench-data/scripts/run.mjs bench-data/fixture "bench-data/results/$arm.json" 2>&1 | tee "bench-data/results/$arm.log"
            cp -a bench-data/fixture/out "bench-data/results/$arm-output"
            test -s "bench-data/results/$arm-output/bundle.cjs"
          done
          for arm in W0 W46 WB2; do
            python3 bench-data/scripts/compare.py bench-data/results/official-output "bench-data/results/$arm-output"
          done
          sha256sum bench-data/results/*-output/* > bench-data/results/output.sha256
      - name: Six-case error parity against official
        run: |
          set -euo pipefail
          mkdir -p bench-data/sw-error
          for arm in W46 WB2; do
            ARM="$arm" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          bindings = {}
          for key, arm in [('control', 'official'), ('treatment', os.environ['ARM'])]:
              native = Path(f'bench-data/{arm}.node').resolve()
              digest = hashlib.sha256(native.read_bytes()).hexdigest()
              identity = json.loads(Path(f'bench-data/results/{arm}.identity.json').read_text())
              assert identity['path'] == str(native) and identity['sha256'] == digest and identity['mapped'] == [str(native)]
              bindings[key] = dict(path=str(native), sha256=digest)
          Path('bench-data/sw-error/bindings.json').write_text(json.dumps(bindings))
          Path('bench-data/sw-error/identity-accepted.json').write_text(json.dumps(dict(accepted=True, bindings=bindings)))
          PY
            node bench-data/scripts/single-wake-error-parity.mjs 2>&1 | tee "bench-data/results/error-$arm.log"
            cp -a bench-data/sw-error "bench-data/results/error-$arm"
          done
      - name: Fake timers on official and WB2
        run: |
          set -euo pipefail
          for arm in official WB2; do
            native="$GITHUB_WORKSPACE/bench-data/$arm.node"
            rm -rf bench-data/fixture/out
            FAKE_TIMERS=1 NAPI_RS_NATIVE_LIBRARY_PATH="$native" EXPECTED_NATIVE_SHA="$(sha256sum "$native" | cut -d' ' -f1)" MAPS_FILE="$GITHUB_WORKSPACE/bench-data/results/fake-$arm.maps" IDENTITY_FILE="$GITHUB_WORKSPACE/bench-data/results/fake-$arm.identity.json" timeout --kill-after=5 120 node --require "$GITHUB_WORKSPACE/bench-data/scripts/identity.cjs" bench-data/scripts/run.mjs bench-data/fixture "bench-data/results/fake-$arm.json" 2>&1 | tee "bench-data/results/fake-$arm.log"
            python3 bench-data/scripts/compare.py bench-data/results/official-output bench-data/fixture/out
          done
      - name: Record verification success
        run: |
          set -euo pipefail
          cp -a bench-data/scripts bench-data/results/scripts
          python3 bench-data/scripts/summarize.py | tee bench-data/results/summary.json
          printf '%s\n' 'All identity, glibc, output, error and fake-timer checks passed.' > bench-data/results/PASS
          date -u +%FT%TZ > bench-data/results/end-utc.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wake-verification
          path: bench-data/results/
          if-no-files-found: error
          compression-level: 1
