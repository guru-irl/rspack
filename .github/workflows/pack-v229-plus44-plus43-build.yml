name: v2.2.9 hot pack with same-run control
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_INCREMENTAL: 0
  npm_config_registry: https://registry.npmjs.org
  npm_config_manage_package_manager_versions: false
  npm_config_package_manager_strict_version: false
  npm_config_engine_strict: false
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true
  PUPPETEER_SKIP_DOWNLOAD: true
jobs:
  build:
    name: Build and test ${{ matrix.arm }}
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: CONTROL
            source: 428b70684309de4068e32baf81d28194441dd64e
          - arm: TREATMENT
            source: b6703e272dbc52294d745073c7f00c3a838989c2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact source and release settings
        run: |
          set -euo pipefail
          mkdir -p bench-data/tmp bench-data/results bench-data/pack bench-data/scripts
          echo "TMPDIR=$GITHUB_WORKSPACE/bench-data/tmp" >> "$GITHUB_ENV"
          printf '%s\n' "$ImageOS" "$ImageVersion" > bench-data/results/runner-image.txt
          date -u +%FT%TZ > bench-data/results/start-utc.txt
          git rev-parse HEAD | tee bench-data/results/source.sha
          test "$(git rev-parse HEAD)" = '${{ matrix.source }}'
          for file in .github/workflows/reusable-release-npm.yml .github/workflows/reusable-build.yml .github/workflows/reusable-build-build.yml rust-toolchain.toml crates/node_binding/scripts/build.mjs Cargo.toml .cargo/config.toml; do
            mkdir -p "bench-data/results/settings/$(dirname "$file")"
            cp "$file" "bench-data/results/settings/$file"
            git diff --exit-code 428b70684309de4068e32baf81d28194441dd64e HEAD -- "$file"
          done
          git diff --exit-code 428b70684309de4068e32baf81d28194441dd64e b6703e272dbc52294d745073c7f00c3a838989c2 -- crates/node_binding/binding.js crates/node_binding/webcontainer-fallback.cjs crates/node_binding/package.json
          printf 'Runtime files are identical between source arms. Ship the official 2.2.9 wrapper.\n' > bench-data/results/wrapper-origin.txt
          for file in identity.cjs; do
            git show '${{ github.sha }}:.github/scripts/hot-pack/'"$file" > "bench-data/scripts/$file"
          done
          test ! -d target
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Pin pnpm independently of the source packageManager field
        run: |
          set -euo pipefail
          npm install --global pnpm@11.26.0
          test "$(node --version)" = v22.23.3
          test "$(pnpm --version)" = 11.26.0
      - name: Install dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile 2>&1 | tee bench-data/results/install.log
          test "$(pnpm --version)" = 11.26.0
          node -e 'const {createRequire}=require("node:module"); const local=createRequire(process.cwd()+"/crates/node_binding/package.json"); const cli=local.resolve("@napi-rs/cli"); const cross=createRequire(cli).resolve("@napi-rs/cross-toolchain"); const r=createRequire(cross); for(const name of ["@napi-rs/lzma","@napi-rs/tar"]) {r(name); console.log(name,r.resolve(name));}' | tee bench-data/results/cross-toolchain-native.txt
      - uses: ./.github/actions/rustup
        with:
          key: hot-release-229
          use-cache: false
      - uses: xc2/free-disk-space@fbe203b3788f2bebe2c835a15925da303eaa5efe
        with:
          tool-cache: false
      - name: Prepare official release build
        run: |
          set -euo pipefail
          command -v clang-14 || { sudo apt-get update; sudo apt-get install -y clang-14; }
          mkdir -p bench-data/bin
          ln -s "$(command -v clang-14)" bench-data/bin/clang
          ln -s "$(command -v clang++-14)" bench-data/bin/clang++
          echo "$GITHUB_WORKSPACE/bench-data/bin" >> "$GITHUB_PATH"
          rustup component add rust-src --toolchain nightly-2026-04-16
          rustup target add x86_64-unknown-linux-gnu --toolchain nightly-2026-04-16
          test "$(rustup show active-toolchain | cut -d' ' -f1)" = nightly-2026-04-16-x86_64-unknown-linux-gnu
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/bench-data/codegen-target" cargo codegen 2>&1 | tee bench-data/results/codegen.log
          printf '\ntrim-paths = true\n' >> .cargo/config.toml
          { date -u; node --version; pnpm --version; rustc -Vv; clang-14 --version; ldd --version; df -h .; } > bench-data/results/environment.txt
          test -z "${RUSTFLAGS:-}${CARGO_ENCODED_RUSTFLAGS:-}"
          test -z "${ALLOCATIVE:-}${SFTRACE:-}${TRACY:-}${DISABLE_PLUGIN:-}"
      - name: Build release binding from scratch
        env:
          RUST_TARGET: x86_64-unknown-linux-gnu
          USE_NAPI_CROSS: 1
          TARGET_CC: clang
        run: |
          set -euo pipefail
          test ! -d target
          start=$(date +%s)
          date -u +%FT%TZ > bench-data/results/build-start-utc.txt
          pnpm run build:binding:release 2>&1 | tee bench-data/results/native-build.log
          echo "$(( $(date +%s) - start ))" > bench-data/results/build-seconds.txt
          date -u +%FT%TZ > bench-data/results/build-end-utc.txt
          grep -E 'Compiling (rspack_napi|rspack_binding_api) ' bench-data/results/native-build.log | tee bench-data/results/recompiled-crates.txt
          test "$(wc -l < bench-data/results/recompiled-crates.txt)" -eq 2
          grep -F -- '--no-default-features --no-dts-cache --features plugin,info-level' bench-data/results/native-build.log
          grep -F -- '-Zbuild-std=panic_abort,std' bench-data/results/native-build.log
          cp crates/node_binding/rspack.linux-x64-gnu.node bench-data/pack/
          cp crates/node_binding/napi-binding.d.ts bench-data/results/generated-napi-binding.d.ts
          git diff -- crates/node_binding/napi-binding.d.ts > bench-data/results/generated-types.diff
      - name: Rebuild this arm's core and JavaScript test artifacts
        run: |
          set -euo pipefail
          pnpm run build:js 2>&1 | tee bench-data/results/js-build.log
          pnpm --dir packages/rspack pack --pack-destination "$GITHUB_WORKSPACE/bench-data/pack" 2>&1 | tee bench-data/results/pack-core.log
          sha256sum packages/rspack/dist/index.js > bench-data/results/built-core.sha256
          git diff --exit-code -- .npmrc pnpm-workspace.yaml pnpm-lock.yaml
      - name: Package exact 2.2.9 identities and inspect glibc
        run: |
          set -euo pipefail
          mkdir -p bench-data/official bench-data/native-package bench-data/unpacked bench-data/wrapper
          (cd bench-data/official; npm pack @rspack/binding@2.2.9; npm pack @rspack/binding-linux-x64-gnu@2.2.9)
          echo '04e1989833d4077e64a1a8569a68119a7633c2bb4be7e5759dab4e6f0d70e116  bench-data/official/rspack-binding-2.2.9.tgz' | sha256sum -c -
          echo '11e6a686ef2756332fe6d29acc4f8c2c8c2bf2c59ea593e2381d9a52b0121d89  bench-data/official/rspack-binding-linux-x64-gnu-2.2.9.tgz' | sha256sum -c -
          tar -xzf bench-data/official/rspack-binding-linux-x64-gnu-2.2.9.tgz -C bench-data/native-package
          readelf --version-info bench-data/native-package/package/rspack.linux-x64-gnu.node > bench-data/results/official-readelf.txt
          echo '6e791a118da96ece3fc1bb03b940772d3e141f47bbb3097fec36a097e7bded9c  bench-data/native-package/package/rspack.linux-x64-gnu.node' | sha256sum -c -
          cp bench-data/pack/rspack.linux-x64-gnu.node bench-data/native-package/package/
          (cd bench-data/native-package/package; npm pack --pack-destination ../../pack)
          cp bench-data/official/rspack-binding-2.2.9.tgz bench-data/pack/
          tar -xzf bench-data/pack/rspack-binding-linux-x64-gnu-2.2.9.tgz -C bench-data/unpacked
          cmp bench-data/pack/rspack.linux-x64-gnu.node bench-data/unpacked/package/rspack.linux-x64-gnu.node
          tar -xzf bench-data/pack/rspack-binding-2.2.9.tgz -C bench-data/wrapper
          for file in binding.js webcontainer-fallback.cjs; do
            sha256sum "crates/node_binding/$file" >> bench-data/results/wrapper-runtime.sha256
            cmp "crates/node_binding/$file" "bench-data/wrapper/package/$file"
          done
          readelf --version-info bench-data/pack/rspack.linux-x64-gnu.node > bench-data/results/built-readelf.txt
          official=$(grep -oE 'GLIBC_[0-9]+\.[0-9]+' bench-data/results/official-readelf.txt | sort -Vu | tail -1)
          built=$(grep -oE 'GLIBC_[0-9]+\.[0-9]+' bench-data/results/built-readelf.txt | sort -Vu | tail -1)
          printf 'official=%s\nbuilt=%s\n' "$official" "$built" | tee bench-data/results/glibc.txt
          test "$(printf '%s\n' "$official" "$built" | sort -V | tail -1)" = "$official"
          (cd bench-data/pack; sha256sum *.tgz *.node > SHA256SUMS)
          python3 - <<'PY'
          import json, tarfile
          from pathlib import Path
          for file in Path('bench-data/pack').glob('*.tgz'):
              with tarfile.open(file) as tf:
                  package=json.load(tf.extractfile('package/package.json'))
                  assert package['version']=='2.2.9',package
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hot-${{ matrix.arm }}-packages
          path: bench-data/pack/
          if-no-files-found: error
          compression-level: 0
      - name: Align launcher copies with this arm's rebuilt core
        run: |
          set -euo pipefail
          for p in node_modules/.pnpm/@rspack+core@*/node_modules/@rspack/core; do
            test -d "$p"
            tar -xzf bench-data/pack/rspack-core-2.2.9.tgz -C "$p" --strip-components=1
            cmp packages/rspack/dist/index.js "$p/dist/index.js"
          done
          for p in node_modules/.pnpm/@rspack+binding@*/node_modules/@rspack/binding; do
            test -d "$p"
            tar -xzf bench-data/pack/rspack-binding-2.2.9.tgz -C "$p" --strip-components=1
          done
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/rspack-test/rstack.config.mts')
          text=p.read_text()
          assert text.count('execArgv: [')==1
          preload=str(Path('bench-data/scripts/identity.cjs').resolve())
          p.write_text(text.replace('execArgv: [', 'execArgv: [\n        "--require='+preload+'",'))
          PY
          native="$GITHUB_WORKSPACE/bench-data/pack/rspack.linux-x64-gnu.node"
          echo "NAPI_RS_NATIVE_LIBRARY_PATH=$native" >> "$GITHUB_ENV"
          echo "EXPECTED_NATIVE_SHA=$(sha256sum "$native" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "NATIVE_IDENTITY_LOG=$GITHUB_WORKSPACE/bench-data/results/test-native-identities.jsonl" >> "$GITHUB_ENV"
          echo "NODE_OPTIONS=--require=$GITHUB_WORKSPACE/bench-data/scripts/identity.cjs" >> "$GITHUB_ENV"
      - name: Run the v2.2.9 Linux CI test command without changing cases
        run: |
          set -euo pipefail
          rc=0
          pnpm run test:ci 2>&1 | tee bench-data/results/test-ci.log || rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > bench-data/results/test-ci.exit
          for file in *-report.txt; do test -f "$file"; cp "$file" bench-data/results/; done
          test -s bench-data/results/rspack-test-event-report.txt
          grep -F 'TEST_RUN_END' bench-data/results/rspack-test-event-report.txt
          git diff --exit-code -- .npmrc pnpm-workspace.yaml pnpm-lock.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hot-${{ matrix.arm }}-evidence
          path: bench-data/results/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 1
  verify:
    name: Compare tests and emitted bytes
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - uses: actions/download-artifact@v4
        with:
          pattern: hot-*-packages
          path: bench-data/packages
      - uses: actions/download-artifact@v4
        with:
          pattern: hot-*-evidence
          path: bench-data/evidence
      - name: Check same build image, payload identities and test outcomes
        run: |
          set -euo pipefail
          mkdir -p bench-data/tmp bench-data/results bench-data/parser bench-data/scripts
          echo "TMPDIR=$GITHUB_WORKSPACE/bench-data/tmp" >> "$GITHUB_ENV"
          cp .github/scripts/hot-pack/* bench-data/scripts/
          cmp bench-data/evidence/hot-CONTROL-evidence/runner-image.txt bench-data/evidence/hot-TREATMENT-evidence/runner-image.txt
          cmp bench-data/evidence/hot-CONTROL-evidence/wrapper-runtime.sha256 bench-data/evidence/hot-TREATMENT-evidence/wrapper-runtime.sha256
          for arm in CONTROL TREATMENT; do (cd "bench-data/packages/hot-$arm-packages"; sha256sum -c SHA256SUMS); done
          python3 bench-data/scripts/classify.py
      - name: Prepare public fixture from its pinned source
        run: |
          set -euo pipefail
          git show a4ca7fd6ff8bc31a48de4ef91922fcb1af1e53dc:scripts/program-native/prepare.mjs > bench-data/scripts/prepare.mjs
          npm install --prefix bench-data/parser --ignore-scripts --no-audit --no-fund acorn escodegen
          node bench-data/scripts/prepare.mjs bench-data/fixture | tee bench-data/results/fixture.json
          python3 bench-data/scripts/compare.py --self-test
          for arm in CONTROL TREATMENT; do
            pack="$GITHUB_WORKSPACE/bench-data/packages/hot-$arm-packages"
            mkdir -p "bench-data/runtime/$arm"
            printf '{"private":true}\n' > "bench-data/runtime/$arm/package.json"
            npm install --prefix "bench-data/runtime/$arm" --ignore-scripts --no-audit --no-fund "$pack/rspack-core-2.2.9.tgz" "$pack/rspack-binding-2.2.9.tgz" "$pack/rspack-binding-linux-x64-gnu-2.2.9.tgz"
            cmp "bench-data/runtime/$arm/node_modules/@rspack/binding-linux-x64-gnu/rspack.linux-x64-gnu.node" "$pack/rspack.linux-x64-gnu.node"
          done
      - name: Compare cold, content-edit and deterministic topology rebuild output
        run: |
          set -euo pipefail
          for variant in deterministic split-chunks; do
            for arm in CONTROL TREATMENT; do
              native="$GITHUB_WORKSPACE/bench-data/packages/hot-$arm-packages/rspack.linux-x64-gnu.node"
              result="$GITHUB_WORKSPACE/bench-data/results/$variant/$arm"
              mkdir -p "$result"
              VARIANT="$variant" CORE_ENTRY="$GITHUB_WORKSPACE/bench-data/runtime/$arm/node_modules/@rspack/core/dist/index.js" RESULT_DIR="$result" NAPI_RS_NATIVE_LIBRARY_PATH="$native" EXPECTED_NATIVE_SHA="$(sha256sum "$native" | cut -d' ' -f1)" NATIVE_IDENTITY_LOG="$result/native.jsonl" MAPS_FILE="$result/native.maps" timeout --kill-after=10s 15m node --require "$GITHUB_WORKSPACE/bench-data/scripts/identity.cjs" bench-data/scripts/watch.cjs 2>&1 | tee "$result/watch.log"
            done
            steps=(cold rebuild)
            if [[ "$variant" == deterministic ]]; then steps+=(add-module); fi
            for step in "${steps[@]}"; do
              python3 bench-data/scripts/compare.py "bench-data/results/$variant/CONTROL/$step" "bench-data/results/$variant/TREATMENT/$step"
            done
          done
          printf 'Cold and content-edit outputs match under both configurations. Deterministic add-module and new-import output also matches.\n' > bench-data/results/output-parity.txt
      - name: Assemble the checked delivery with README and checksums
        run: |
          set -euo pipefail
          python3 bench-data/scripts/export.py
          (cd bench-data/delivery; sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: hot-pack-delivery
          path: bench-data/delivery/
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hot-verification-evidence
          path: |
            bench-data/results/
            bench-data/scripts/
          if-no-files-found: error
          compression-level: 1
