name: bench deterministic chunk ids size
on:
  workflow_dispatch:
    inputs:
      refs:
        description: JSON array of refs to measure
        default: '["f2903b6482cb7a0fcdca912d23062bd94d3d5636", "856680217de22e88729429cf204606e7df727eac", "1c1d2714653f8bc50f0a7f625d59ecb8ac6b8075"]'
        type: string
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(inputs.refs || '["f2903b6482cb7a0fcdca912d23062bd94d3d5636", "856680217de22e88729429cf204606e7df727eac", "1c1d2714653f8bc50f0a7f625d59ecb8ac6b8075"]') }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'
      TARGET_CC: clang
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
      - uses: ./.github/actions/pnpm/setup
      - run: pnpm --filter @rspack/binding install --frozen-lockfile
      - uses: ./.github/actions/rustup
        with:
          key: ids-size
          use-cache: false
      - uses: xc2/free-disk-space@fbe203b3788f2bebe2c835a15925da303eaa5efe
        with:
          tool-cache: false
      - name: Install diagnostics
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Exact CI build
        run: |
          mkdir -p .spider/scratch/ids-size
          export TMPDIR="$PWD/.spider/scratch/ids-size/tmp"
          mkdir -p "$TMPDIR"
          git rev-parse HEAD > .spider/scratch/ids-size/sha.txt
          rustc -vV > .spider/scratch/ids-size/toolchain.txt
          clang --version >> .spider/scratch/ids-size/toolchain.txt
          ld --version >> .spider/scratch/ids-size/toolchain.txt
          rustup target add x86_64-unknown-linux-gnu
          cargo codegen
          printf '\ntrim-paths = true\nchecksum-freshness = true\n' >> .cargo/config.toml
          RUST_TARGET=x86_64-unknown-linux-gnu USE_NAPI_CROSS=1 MEASURE_CARGO_FRESH=1 pnpm build:binding:ci 2>&1 | tee .spider/scratch/ids-size/build.log
          cp crates/node_binding/rspack.linux-x64-gnu.node .spider/scratch/ids-size/unstripped.node
          nm -S --size-sort --radix=d --demangle .spider/scratch/ids-size/unstripped.node > .spider/scratch/ids-size/symbols.txt
          readelf -SW .spider/scratch/ids-size/unstripped.node > .spider/scratch/ids-size/sections.txt
          cp .spider/scratch/ids-size/unstripped.node .spider/scratch/ids-size/rspack.linux-x64-gnu.node
          strip .spider/scratch/ids-size/rspack.linux-x64-gnu.node
          stat -c '%s' .spider/scratch/ids-size/rspack.linux-x64-gnu.node > .spider/scratch/ids-size/size.txt
      - name: Rust format and focused lint
        run: |
          out="$PWD/.spider/scratch/ids-size"
          cargo fmt --all --check > "$out/format.log" 2>&1 || {
            cargo fmt --all
            git diff > "$out/format.patch"
            exit 1
          }
          cargo check -p rspack_core -p rspack_ids -p rspack_macros -p rspack_plugin_progress > "$out/check.log" 2>&1
          cargo clippy -p rspack_core -p rspack_ids -p rspack_macros -p rspack_plugin_progress --all-targets --no-deps -- -D warnings > "$out/clippy.log" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ids-size-${{ matrix.ref }}
          path: .spider/scratch/ids-size
          retention-days: 14
          compression-level: 1
