name: v2.3.0 arena experiment
on:
  push:
    branches: [bench/v230-mem4-arena-build]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
env:
  CARGO_INCREMENTAL: 0
  npm_config_registry: https://registry.npmjs.org
  VERSION: 2.3.0
  SOURCE: a757666ff20b5a17aed5fe514c15c2e4bf245935
jobs:
  official:
    name: Published 2.3.0 tarballs
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Pack published tarballs and check registry integrity
        run: |
          set -euo pipefail
          mkdir -p official && cd official
          for p in @rspack/core @rspack/binding @rspack/binding-linux-x64-gnu; do
            j="$(echo "$p" | tr -d '@' | tr '/' '-').pack.json"
            npm pack "$p@$VERSION" --json > "$j"
            want=$(npm view "$p@$VERSION" dist.integrity)
            got=$(node -e 'console.log(require(process.argv[1])[0].integrity)' "$PWD/$j")
            test "$want" = "$got"
            echo "$p@$VERSION $want" | tee -a integrity.txt
          done
          sha256sum ./*.tgz | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: v230-official
          path: official/
          if-no-files-found: error
          compression-level: 0
  build:
    name: Build capped arena
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a757666ff20b5a17aed5fe514c15c2e4bf245935
          fetch-depth: 5
          persist-credentials: false
      - name: Record exact source
        run: |
          set -euo pipefail
          mkdir -p bench-data/tmp bench-data/results bench-data/pack
          echo "TMPDIR=$GITHUB_WORKSPACE/bench-data/tmp" >> "$GITHUB_ENV"
          printf '%s\n' "$ImageOS" "$ImageVersion" > bench-data/results/runner-image.txt
          date -u +%FT%TZ > bench-data/results/start-utc.txt
          git rev-parse HEAD | tee bench-data/results/source.sha
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git diff ca0d75f5444f182acd571968395a3ac1aaff894c HEAD > bench-data/results/source-diff-from-v2.3.0.patch
          test ! -d target
      - uses: ./.github/actions/pnpm/setup
      - name: Install binding dependencies
        run: |
          set -euo pipefail
          pnpm --filter @rspack/binding install --frozen-lockfile 2>&1 | tee bench-data/results/install.log
      - uses: ./.github/actions/rustup
        with:
          key: v230-arena-experiment
          use-cache: false
      - uses: xc2/free-disk-space@fbe203b3788f2bebe2c835a15925da303eaa5efe
        with:
          tool-cache: false
      - name: Prepare release-style build and cap arena chunks
        run: |
          set -euo pipefail
          command -v clang || { sudo apt-get update; sudo apt-get install -y clang; }
          rustup target add x86_64-unknown-linux-gnu
          cargo codegen 2>&1 | tee bench-data/results/codegen.log
          cargo fetch --locked --target x86_64-unknown-linux-gnu 2>&1 | tee bench-data/results/fetch.log
          python3 - <<'PY'
          import glob
          import hashlib
          import os
          import pathlib
          import shutil
          candidates = glob.glob(os.path.expanduser('~/.cargo/registry/src/*/ustr-fxhash-1.0.1'))
          assert len(candidates) == 1, candidates
          src = pathlib.Path(candidates[0])
          orig = src / 'src/stringcache.rs'
          expected = '394cd528929d801736c7a7572087f05a8a4f281c518bdc57b9c27a7d55947dcc'
          assert hashlib.sha256(orig.read_bytes()).hexdigest() == expected
          dst = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ustr-fxhash-1.0.1-arena256'
          shutil.copytree(src, dst)
          target = dst / 'src/stringcache.rs'
          text = target.read_text()
          before = '                .expect("capacity * 2 overflowed")\n                .max(alloc_size);'
          after = '                .expect("capacity * 2 overflowed")\n                .min(256 * 1024)\n                .max(alloc_size);'
          assert text.count(before) == 1
          target.write_text(text.replace(before, after))
          manifest = pathlib.Path('Cargo.toml')
          assert '[patch.crates-io]' not in manifest.read_text()
          with manifest.open('a') as f:
              f.write('\n[patch.crates-io]\nustr-fxhash = { path = "' + str(dst) + '" }\n')
          pathlib.Path('bench-data/results/arena-source.sha256').write_text(expected + '\n')
          pathlib.Path('bench-data/results/arena-change.txt').write_text(before + '\n---\n' + after + '\n')
          PY
          cargo tree -i ustr-fxhash 2>&1 | tee bench-data/results/arena-tree.txt
          grep -F 'ustr-fxhash v1.0.1 (' bench-data/results/arena-tree.txt
          printf '\ntrim-paths = true\n' >> .cargo/config.toml
          { date -u; node --version; pnpm --version; rustc -Vv; clang --version; gcc --version; ldd --version; df -h .; } > bench-data/results/environment.txt
          test -z "${RUSTFLAGS:-}${CARGO_ENCODED_RUSTFLAGS:-}${SFTRACE:-}${TRACY:-}${DISABLE_PLUGIN:-}"
      - name: Build binding from scratch
        env:
          RUST_TARGET: x86_64-unknown-linux-gnu
          USE_NAPI_CROSS: 1
          TARGET_CC: clang
        run: |
          set -euo pipefail
          start=$(date +%s)
          pnpm run build:binding:release 2>&1 | tee bench-data/results/native-build.log
          echo "$(( $(date +%s) - start ))" > bench-data/results/build-seconds.txt
          date -u +%FT%TZ > bench-data/results/build-end-utc.txt
          grep -E 'Compiling (rspack_napi|rspack_binding_api|rspack_core) ' bench-data/results/native-build.log | tee bench-data/results/recompiled-crates.txt
          test "$(wc -l < bench-data/results/recompiled-crates.txt)" -ge 3
          grep -F -- '-Zbuild-std=panic_abort,std' bench-data/results/native-build.log > /dev/null
          grep -oE -- '--features [a-z0-9,-]+' bench-data/results/native-build.log | head -1 | tee bench-data/results/features.txt
          grep -qx -- '--features plugin,info-level' bench-data/results/features.txt
          ! grep -F -q -- '--cfg=allocative' bench-data/results/native-build.log
          cp crates/node_binding/rspack.linux-x64-gnu.node bench-data/pack/
      - name: Package native binding and record glibc
        run: |
          set -euo pipefail
          mkdir -p bench-data/official bench-data/package bench-data/unpacked
          (cd bench-data/official; npm pack "@rspack/binding-linux-x64-gnu@$VERSION")
          tar -xzf "bench-data/official/rspack-binding-linux-x64-gnu-$VERSION.tgz" -C bench-data/official
          cp -a bench-data/official/package bench-data/package/
          cp bench-data/pack/rspack.linux-x64-gnu.node bench-data/package/package/
          node -e 'const p=require("./bench-data/package/package/package.json"); if(p.name!=="@rspack/binding-linux-x64-gnu"||p.version!==process.env.VERSION)throw Error("Wrong package identity")'
          (cd bench-data/package/package; npm pack --pack-destination ../../pack)
          tar -xzf "bench-data/pack/rspack-binding-linux-x64-gnu-$VERSION.tgz" -C bench-data/unpacked
          cmp bench-data/pack/rspack.linux-x64-gnu.node bench-data/unpacked/package/rspack.linux-x64-gnu.node
          sha256sum bench-data/pack/* | tee bench-data/results/pack.sha256
          official=$(readelf --version-info bench-data/official/package/rspack.linux-x64-gnu.node | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -1)
          built=$(readelf --version-info bench-data/pack/rspack.linux-x64-gnu.node | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -1)
          printf 'official=%s\nbuilt=%s\n' "$official" "$built" | tee bench-data/results/glibc.txt
          test "$(printf '%s\n' "$official" "$built" | sort -V | tail -1)" = "$official"
      - uses: actions/upload-artifact@v4
        with:
          name: v230-arena256-binding
          path: bench-data/pack/
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v230-arena256-evidence
          path: bench-data/results/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 1
  verify:
    name: Verify output parity
    needs: [official, build]
    if: ${{ !cancelled() && needs.official.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - uses: actions/download-artifact@v4
        with:
          pattern: v230-*-binding
          path: bench-data/bindings
      - uses: actions/download-artifact@v4
        with:
          name: v230-official
          path: bench-data/official
      - name: Compare output with the published binding
        run: bash .github/scripts/pack-v230/verify-fix.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v230-arena256-verification
          path: bench-data/results/
          if-no-files-found: error
          compression-level: 1
