name: PR59 startup event-path diagnosis
on:
  push:
    branches: [bench/pr59-xplat-cost-events]
    paths: ['.github/workflows/bench-pr59-cost-events.yml', 'bench/cost-profile/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: pr59-cost-events-${{ github.sha }}
  cancel-in-progress: false
env:
  COST_SOURCE_SHA: 1810ebe4ca553451b1f4e6237095a0329da87436
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arm: before, ref: b87c553ce76f2055d2ee19de589f5bbc106ff23d}
          - {arm: cost, ref: 1810ebe4ca553451b1f4e6237095a0329da87436}
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set scratch paths
        shell: bash
        run: |
          mkdir -p "$PWD/.bench-wide/tmp"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$PWD/.bench-wide/tmp" "$PWD/.bench-wide/tmp" "$PWD/.bench-wide/tmp" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
          path: source
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - name: Repair Rust proxies
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --retry 5 -fsSL https://sh.rustup.rs | sh -s -- --default-toolchain none -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build temporary counter binding with native symbols
        shell: bash
        env:
          SOURCE_REF: ${{ matrix.ref }}
          RUST_TARGET: aarch64-apple-darwin
          BENCH_INSTRUMENT: '0'
          CARGO_PROFILE_RELEASE_STRIP: none
        run: |
          set -euo pipefail
          node bench/cost-profile/instrument.cjs
          mkdir -p .bench-wide/artifact
          git -C source diff > .bench-wide/artifact/instrumentation.patch
          bash bench/wide-memory/build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wide-binding-macOS-${{ matrix.arm }}
          path: .bench-wide/artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  diagnose:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set scratch paths
        run: |
          mkdir -p "$PWD/.bench-wide/tmp" "$PWD/.bench-wide/results"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$PWD/.bench-wide/tmp" "$PWD/.bench-wide/tmp" "$PWD/.bench-wide/tmp" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 79c650c24e4b468e743ebfe6454b3b2bc6650938
          path: source
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          pattern: wide-binding-macOS-*
          run-id: 41106150672
          github-token: ${{ github.token }}
          path: .bench-wide/bindings/
      - uses: actions/download-artifact@v4
        with:
          pattern: wide-binding-macOS-*
          path: .bench-wide/bindings/
      - name: Record delivered probes, rebuilds and native stacks
        env:
          BENCH_DIAGNOSTIC: '1'
          BENCH_NATIVE_STACKS: '1'
          RSPACK_WATCH_DIAGNOSTICS: '1'
        run: |
          set -euo pipefail
          cp bench/cost-profile/profile.cjs bench/wide-memory/diagnostic.cjs
          bash bench/wide-memory/measure.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-event-summary
          path: .bench-wide/results/profile-summary.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-event-raw
          path: .bench-wide/results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
